<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gearhold</title>
<style>
  :root {
    --bg: #07080a;
    --glass: rgba(14, 16, 20, 0.62);
    --edge: rgba(255, 255, 255, 0.1);
    --text: #f3efe6;
    --dim: #a39d92;
    --hot: #ff8a2a;
    --hot2: #ffcf6a;
    --good: #46e89a;
    --bad: #ff4d3d;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 600 15px/1.3 "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; touch-action: none; overflow: hidden; background: #000; }
  #world { position: absolute; inset: -2%; }
  #world canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #view { image-rendering: auto; }
  #hands { pointer-events: none; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at center, transparent 65%, rgba(0,0,0,.3) 100%); }
  #hitdir { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; opacity: 0; }
  #hitdir i { position: absolute; left: -9px; top: -39vmin; width: 18px; height: 34px; background: linear-gradient(180deg, #ffd27a, #d9a441 55%, #7a5418); clip-path: polygon(50% 0, 100% 100%, 50% 80%, 0 100%); filter: drop-shadow(0 0 5px rgba(255,190,60,.7)); }
  #hurt { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at center, transparent 35%, rgba(255,30,10,.75)); opacity: 0; }
  #keyglow { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at center, transparent 50%, rgba(217,164,65,.55) 85%, rgba(255,205,100,.85)); box-shadow: inset 0 0 40px rgba(217,164,65,.6); opacity: 0; }
  #glow { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at center, rgba(255,220,120,.05), rgba(255,200,90,.3)); opacity: 0; }

  #hud {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    pointer-events: none;
  }
  .panel {
    background: var(--glass); border: 1px solid var(--edge); border-radius: 12px;
    padding: 7px 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  .label { font-size: 10px; letter-spacing: .16em; color: var(--dim); text-transform: uppercase; }
  .hp { display: grid; grid-template-columns: auto auto; align-items: center; column-gap: 10px; min-width: 150px; }
  .hp b { font-size: 22px; font-variant-numeric: tabular-nums; grid-row: span 2; text-align: right; }
  .bar { height: 7px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; width: 110px; }
  .bar i { display: block; height: 100%; width: 100%; border-radius: 4px; background: linear-gradient(90deg, #2ad47d, #8af5b8); box-shadow: 0 0 10px rgba(80,240,150,.6); transition: width .15s; }
  .hp.low .bar i { background: linear-gradient(90deg, #ff3b2a, #ff8a5a); box-shadow: 0 0 10px rgba(255,70,40,.7); }
  .hp.low b { color: var(--bad); }
  .mid { text-align: center; }
  .mid #lvl { font-size: 13px; }
  .mid #kills { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .ammo { display: flex; align-items: center; gap: 10px; }
  .ammo b { font-size: 22px; font-variant-numeric: tabular-nums; }
  #compass { width: 26px; height: 26px; border-radius: 50%; position: relative; flex: none; background: radial-gradient(circle, #2a1a06 55%, #7a5418 60%, #d9a441 72%, #4a3009 76%); box-shadow: 0 0 5px rgba(255,190,60,.35); }
  #needle { position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin: -10px 0 0 -3px; border-left: 3px solid transparent; border-right: 3px solid transparent; border-bottom: 10px solid #ffd27a; transform-origin: 3px 10px; }
  #compass::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: #b8812a; }
  #key { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle, #3a2405 28%, #ffc53d 30%, #ffc53d 62%, transparent 64%); filter: drop-shadow(0 0 6px rgba(255,190,60,.8)); }
  .btns { display: flex; gap: 6px; pointer-events: auto; }
  .btns button {
    font: inherit; font-size: 12px; color: var(--text); background: var(--glass); border: 1px solid var(--edge);
    border-radius: 10px; min-width: 42px; min-height: 40px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #msg {
    position: absolute; left: 50%; top: 24%; transform: translateX(-50%);
    padding: 8px 16px; background: var(--glass); border: 1px solid var(--edge); border-radius: 10px;
    pointer-events: none; text-align: center; max-width: 80vw; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    text-shadow: 0 1px 2px #000;
  }

  .touch { position: absolute; pointer-events: none; }
  #stick { width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 2px solid rgba(255,255,255,.28); background: radial-gradient(rgba(255,255,255,.06), transparent 70%); }
  #knob { width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.55), rgba(255,255,255,.18)); }
  .tbtn {
    position: absolute; pointer-events: auto; border: 1px solid rgba(255,255,255,.25); border-radius: 50%;
    font: 700 13px "Avenir Next", system-ui, sans-serif; letter-spacing: .08em; color: #fff; touch-action: none;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #fire { right: max(22px, env(safe-area-inset-right)); bottom: max(34px, env(safe-area-inset-bottom)); width: 94px; height: 94px; background: radial-gradient(circle at 40% 35%, rgba(255,160,80,.75), rgba(220,80,20,.55)); box-shadow: 0 0 24px rgba(255,120,40,.35); }
  #swap { right: max(128px, calc(env(safe-area-inset-right) + 106px)); bottom: max(46px, env(safe-area-inset-bottom)); width: 60px; height: 60px; background: rgba(255,255,255,.16); }

  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; box-sizing: border-box; text-align: center;
    background: radial-gradient(circle at center, rgba(8,10,22,.12), rgba(4,5,12,.72) 85%);
  }
  #overlay h1 {
    margin: 0; font-size: clamp(44px, 11vw, 96px); font-weight: 800; letter-spacing: .12em;
    background: linear-gradient(180deg, #fff3d0 0%, var(--hot2) 35%, var(--hot) 65%, #a8400c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(255,120,30,.55)) drop-shadow(0 5px 0 rgba(40,14,2,.9));
  }
  #overlay .tag { font-size: 12px; letter-spacing: .4em; color: var(--hot2); text-transform: uppercase; margin-top: -8px; }
  #overlay p { margin: 0; max-width: 520px; line-height: 1.5; text-shadow: 0 1px 3px #000; }
  #stats { color: var(--hot2); font-variant-numeric: tabular-nums; }
  #levels { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  #overlay button {
    font: inherit; font-weight: 700; letter-spacing: .06em; color: #1c0c02;
    background: linear-gradient(180deg, #ffd27a, var(--hot)); border: 0; border-radius: 12px;
    padding: 13px 28px; min-height: 48px; cursor: pointer; box-shadow: 0 6px 24px rgba(255,120,30,.35), inset 0 1px 0 rgba(255,255,255,.5);
  }
  #overlay button.alt { background: rgba(255,255,255,.1); color: var(--text); box-shadow: inset 0 0 0 1px var(--edge); }
  .help { color: var(--dim); font-size: 13px; }
  @media (max-width: 560px) {
    .mid #lvl, .wide, #hpbox .label, #wname { display: none; }
    #hud { gap: 6px; }
    .btns button { min-width: 38px; }
    .hp { min-width: 0; }
    .bar { width: 70px; }
    .hp b, .ammo b { font-size: 18px; }
    .panel { padding: 6px 9px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <canvas id="view"></canvas>
    <canvas id="hands"></canvas>
  </div>
  <div id="vignette"></div>
  <div id="hurt"></div>
  <div id="hitdir" aria-hidden="true"><i></i></div>
  <div id="keyglow"></div>
  <div id="glow"></div>
  <div id="hud" hidden>
    <div class="panel hp" id="hpbox"><span class="label">Integrity</span><b id="hp">100</b><div class="bar"><i id="hpbar"></i></div></div>
    <div class="panel mid"><div id="lvl"></div><div><span class="label wide">Scrapped </span><span id="kills"></span></div></div>
    <div style="display:flex;gap:8px;align-items:flex-start">
      <div class="panel ammo"><div><div class="label" id="wname">Hand cannon</div><b id="ammo">&infin;</b></div><span id="key" hidden></span><span id="compass" aria-hidden="true"><i id="needle"></i></span></div>
      <div class="btns"><button id="mute" aria-label="Sound on or off">SND</button><button id="pause" aria-label="Pause">II</button></div>
    </div>
  </div>
  <div id="msg" hidden></div>
  <div id="touchui" hidden>
    <div class="touch" id="stick" hidden></div>
    <div class="touch" id="knob" hidden></div>
    <button class="tbtn" id="swap" aria-label="Switch weapon">SWAP</button>
    <button class="tbtn" id="fire" aria-label="Fire">FIRE</button>
  </div>
  <div id="overlay">
    <h1 id="title">GEARHOLD</h1>
    <div class="tag" id="tag">the clockwork citadel</div>
    <p id="detail"></p>
    <p id="stats"></p>
    <div id="levels"></div>
    <p class="help" id="help"></p>
  </div>
</div>

<script type="module">
import { createStudio, resolveEndpoint } from '../sdk/studio-sdk.js';
import { LEVELS, WALLS } from './levels.js';
import { PRESS, pressState } from './press.js';
import { createRenderer, M4 } from './render3d.js';
import { buildLevel, buildDoor, buildLantern, buildMachines, buildItems, buildScenery, buildArmillary } from './models.js';
import { buildGuns, gunTriangles } from './gun3d.js';
import { spawnYaw } from './spawn.js';
import { makeCheckpoint, parseCheckpoint } from './checkpoint.js';

const HAL = new URLSearchParams(location.search).has('hal'); // test robot only; see the hal hook block at the end
const hal = { shots: 0, hits: 0, dmg: 0, unseen: 0, hit: false, overhead: false }; // plain counters and the hook's overhead flag, set only by the hook

const studio = createStudio({ game: 'gearhold', version: '0.5.2', endpoint: HAL ? '' : resolveEndpoint(location, window.STUDIO_CONFIG) });

const $ = (id) => document.getElementById(id);
const view = $('view');
const hands = $('hands'), hctx = hands.getContext('2d');
const coarse = matchMedia('(pointer: coarse)').matches;
const R3 = createRenderer(view);
const EYE = 0.6; // eye height; walls are 2 to 4 tall and the sky is open
const lin = (c, k = 1) => c.map((v) => Math.pow(v, 2.2) * k);

// ---------- progress (per-device convenience only) ----------
const SAVE_KEY = 'gearhold.unlocked';
let unlocked = 0;
try { unlocked = Math.min(LEVELS.length - 1, Number(localStorage.getItem(SAVE_KEY)) || 0); } catch { /* private mode */ }
function saveUnlocked(n) {
  unlocked = Math.max(unlocked, Math.min(n, LEVELS.length - 1));
  try { localStorage.setItem(SAVE_KEY, String(unlocked)); } catch { /* memory only */ }
}
// Gear-key checkpoint (see checkpoint.js): set on picking up the key, cleared on a fresh start or a clear.
const CP_KEY = 'gearhold.checkpoint';
let checkpoint = null;
try { checkpoint = parseCheckpoint(localStorage.getItem(CP_KEY), LEVELS, WALLS); } catch { /* private mode */ }
function setCheckpoint(cp) {
  checkpoint = cp;
  try { if (cp) localStorage.setItem(CP_KEY, JSON.stringify(cp)); else localStorage.removeItem(CP_KEY); } catch { /* memory only */ }
}

// ---------- sound (synthesised, no files) ----------
let ac = null, master = null, muted = false, noiseBuf = null;
function wakeAudio() {
  if (!ac) {
    try {
      // iPhone: Web Audio is muted by the ring/silent switch unless the page's audio session is 'playback', like a music app.
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch { /* older browsers: follows the ringer */ }
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createDynamicsCompressor();
      master.connect(ac.destination);
    } catch { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(f0, f1, dur, type, vol, delay = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq, type = 'lowpass') {
  if (!ac || muted) return;
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = frand() * 2 - 1;
  }
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(master);
  s.start(t, frand() * 0.5); s.stop(t + dur);
}
const sfx = {
  bolt() { noise(0.35, 0.45, 1800); noise(0.08, 0.3, 6000, 'highpass'); tone(140, 38, 0.3, 'sawtooth', 0.13); tone(1300, 900, 0.03, 'square', 0.03, 0.33); },
  scatter() { noise(0.4, 0.42, 1100); noise(0.12, 0.3, 5000, 'highpass'); tone(160, 40, 0.3, 'sawtooth', 0.12); tone(900, 700, 0.06, 'square', 0.05, 0.38); },
  orb() { tone(240, 760, 0.28, 'sine', 0.06); tone(480, 1500, 0.2, 'triangle', 0.02); },
  hurt() { tone(180, 50, 0.25, 'square', 0.1); noise(0.12, 0.12, 900); },
  // Brass tick plus a soft click.
  hit() { tone(1800, 1000, 0.05, 'square', 0.035); tone(2600, 2300, 0.07, 'triangle', 0.03); noise(0.02, 0.04, 4500, 'highpass'); },
  boom() { noise(0.9, 0.5, 520); noise(0.25, 0.3, 2400); tone(110, 28, 0.6, 'sawtooth', 0.14); },
  pickup() { tone(520, 1040, 0.09, 'triangle', 0.1); tone(780, 1560, 0.12, 'triangle', 0.08, 0.07); },
  // Clockwork ratchet: three quick brass clicks climbing, then a soft bell.
  keyChime() {
    [0, 0.06, 0.12].forEach((d, i) => { tone(2200 + i * 350, 1500 + i * 250, 0.03, 'square', 0.03, d); noise(0.025, 0.05, 4000, 'highpass'); });
    tone(1046, 1040, 0.5, 'sine', 0.07, 0.19); tone(2093, 2085, 0.35, 'sine', 0.025, 0.19);
  },
  door() { noise(0.8, 0.09, 300); tone(90, 70, 0.7, 'sawtooth', 0.03); },
  bite() { noise(0.1, 0.18, 2400); tone(300, 120, 0.08, 'square', 0.05); },
  thump() { noise(0.22, 0.2, 240); tone(75, 38, 0.22, 'sine', 0.12); },
  locked() { tone(150, 130, 0.14, 'square', 0.07); tone(120, 100, 0.18, 'square', 0.07, 0.15); },
  exit() { [523, 659, 784, 1046].forEach((f, i) => tone(f, f * 1.01, 0.35, 'triangle', 0.1, i * 0.09)); },
  die() { tone(400, 40, 1.2, 'sawtooth', 0.12); noise(1.0, 0.2, 400); },
};

// ---------- entity tables ----------
const STATS = {
  d: { hp: 30, speed: 1.7, radius: 0.3 },
  c: { hp: 20, speed: 3.0, radius: 0.3 },
  b: { hp: 260, speed: 1.05, radius: 0.5 },
  o: { hp: 18, speed: 0, radius: 0.26, prop: true },
};
const ITEM_KINDS = 'hakw';
// Hit volumes: spheres [forward offset, height, radius] fitted to each machine's model.
function volumes(e) {
  if (e.kind === 'd') return [[0, e.hz, 0.25]];
  if (e.kind === 'c') return [[0, 0.17, 0.26], [0.26, 0.15, 0.11]];
  if (e.kind === 'b') return [[0, 0.3, 0.24], [0, 0.8, 0.4], [0, 1.27, 0.17]];
  return [[0, 0.28, 0.21]];
}

// ---------- level state ----------
const P = {
  x: 0, y: 0, a: 0, hp: 100, shells: 0, scatter: false, weapon: 0, key: false, cd: 0, bob: 0, bobAmp: 0, recoil: 0, flash: 0, flashRot: 0,
  vx: 0, vy: 0, av: 0, look: 0, kick: 0, swayX: 0, swayY: 0, hitMark: 0, hitKill: false, tracer: 0, tracerTo: null,
};
const LOOK_MAX = 1.2; // tan of the steepest up/down look (about 50 degrees)
let sens = 1;
try { sens = Math.max(0.3, Math.min(3, Number(localStorage.getItem('gearhold.sens')) || 1)); } catch { /* default */ }
// Where the crosshair points: P.look plus recoil kick. Rendering and shooting share it.
const viewLook = () => P.look + P.kick;

let level = 0, mw = 0, mh = 0, grid = [], doorOpen = new Float32Array(0), doorMoving = new Uint8Array(0);
let enemies = [], items = [], shots = [], fx = [], foes = 0, presses = [];
let hitFx = 0, hitDeg = 0;
let kills = 0, levelTime = 0, noiseRadius = 0, msgTime = 0, lockedNag = 0, hurtFx = 0, glowFx = 0, keyFx = 0, shake = 0;
let mode = 'title';
let mood = LEVELS[0].mood;
let wallH = new Float32Array(0);
const dyn = [];

const isWall = (c) => WALLS.includes(c);
const isDoor = (c) => c === 'D' || c === 'K';
const cell = (x, y) => (x < 0 || y < 0 || x >= mw || y >= mh ? '#' : grid[y * mw + x]);
function solid(x, y) {
  const c = cell(x, y);
  return isWall(c) || (isDoor(c) && doorOpen[y * mw + x] < 0.95);
}

function loadLevel(i) {
  level = i;
  const map = LEVELS[i].map;
  mood = LEVELS[i].mood;
  mh = map.length; mw = map[0].length;
  grid = new Array(mw * mh);
  doorOpen = new Float32Array(mw * mh);
  doorMoving = new Uint8Array(mw * mh);
  enemies = []; items = []; shots = []; fx = []; presses = [];
  Object.assign(P, { hp: 100, shells: 0, scatter: false, weapon: 0, key: false, cd: 0, recoil: 0, flash: 0, vx: 0, vy: 0, av: 0, look: 0, kick: 0, hitMark: 0, tracer: 0 });
  for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
    const c = map[y][x];
    grid[y * mw + x] = c === 'S' || c === 'u' || STATS[c] || ITEM_KINDS.includes(c) ? '.' : c;
    if (c === 'u') presses.push({ x, y, was: 'open', hit: false });
    else if (c === 'S') { P.x = x + 0.5; P.y = y + 0.5; }
    else if (STATS[c]) {
      enemies.push({ kind: c, ...STATS[c], x: x + 0.5, y: y + 0.5, awake: false, cd: 0, atk: 0, flash: 0, anim: Math.random() * 3, strafe: 1, strafeT: 0, dead: false, smokeT: 0, puffT: 0, face: Math.random() * 6, hz: 0.62, moving: 0, spin: 0 });
    } else if (ITEM_KINDS.includes(c)) items.push({ id: items.length, kind: c, x: x + 0.5, y: y + 0.5, phase: Math.random() * 6 });
  }
  foes = enemies.filter((e) => !e.prop).length;
  const sx = Math.floor(P.x), sy = Math.floor(P.y);
  P.a = spawnYaw(map, sx, sy, WALLS + 'DK');
  kills = 0; levelTime = 0; noiseRadius = 0;
  if (R3) buildGfx();
}

// Picking up the key: remember the level as it stands (taken is filled in by the caller once the key is gone).
function saveCheckpoint() {
  const taken = new Set(items.map((it) => it.id));
  const all = LEVELS[level].map.join('').split('').filter((c) => ITEM_KINDS.includes(c)).length;
  setCheckpoint(makeCheckpoint({
    level, x: P.x, y: P.y, shells: P.shells, scatter: P.scatter,
    dead: enemies.flatMap((e, i) => (e.dead ? [i] : [])),
    taken: Array.from({ length: all }, (_, i) => i).filter((i) => !taken.has(i)),
    doors: Array.from(doorMoving.keys()).filter((i) => doorMoving[i]),
  }));
}
// Rebuild the level at the checkpoint: what was scrapped, taken or opened stays so; the key is in hand.
function applyCheckpoint(cp) {
  loadLevel(cp.level);
  for (const i of cp.dead) { const e = enemies[i]; if (e) { e.dead = true; if (!e.prop) kills += 1; } }
  const taken = new Set(cp.taken);
  items = items.filter((it) => !taken.has(it.id));
  for (const i of cp.doors) if (isDoor(grid[i])) { doorMoving[i] = 1; doorOpen[i] = 1; }
  Object.assign(P, { x: cp.x, y: cp.y, key: true, scatter: cp.scatter, shells: cp.shells, weapon: cp.scatter && cp.shells > 0 ? 1 : 0 });
  P.a = spawnYaw(LEVELS[cp.level].map, Math.floor(cp.x), Math.floor(cp.y), WALLS + 'DK');
}

// ---------- graphics resources ----------
const MESH = {}, ITEM_MESH = {}, DOOR_MESH = {};
let GUNS = [], G = null;
if (R3) {
  const m = buildMachines();
  for (const k in m) { MESH[k] = {}; for (const p in m[k]) MESH[k][p] = R3.mesh(m[k][p]); }
  const it = buildItems();
  for (const k in it) ITEM_MESH[k] = R3.mesh(it[k]);
  for (const axis of ['x', 'z']) for (const kind of ['D', 'K']) DOOR_MESH[axis + kind] = R3.mesh(buildDoor(axis, kind));
  MESH.armillary = R3.mesh(buildArmillary());
  GUNS = buildGuns();
}
// Floating crystal lanterns: room interiors first, then corridors, spaced apart.
function placeLamps() {
  const open = (x, y) => { const c = cell(x, y); return !isWall(c) && !isDoor(c); };
  const lamps = [];
  for (const [interior, gap] of [[true, 3.4], [false, 4.6]]) {
    for (let y = 1; y < mh - 1; y++) for (let x = 1; x < mw - 1; x++) {
      if (!open(x, y) || lamps.some(([lx, ly]) => lx === x && ly === y)) continue;
      if (interior) {
        let all = true;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) all &&= open(x + dx, y + dy);
        if (!all) continue;
      }
      if (lamps.some(([lx, ly]) => (lx - x) ** 2 + (ly - y) ** 2 < gap * gap)) continue;
      lamps.push([x, y]);
    }
  }
  return lamps;
}
function buildGfx() {
  if (G) for (const m of [G.level, G.scenery, G.lantern]) R3.free(m);
  const L = buildLevel(grid, mw, mh, mood);
  wallH = L.heights;
  const lamps = placeLamps();
  G = {
    level: R3.mesh(L.data),
    scenery: R3.mesh(buildScenery(mw / 2, mh / 2)),
    lantern: R3.mesh(buildLantern(mood)),
    doors: L.doors,
    lamps,
    emitters: L.emitters,
    lights: [
      ...lamps.map(([x, y]) => ({ p: [x + 0.5, 1.75, y + 0.5], r: 6.5, c: lin(mood.lamp, 1.6) })),
      ...L.emitters.map((e) => ({ p: e.p, r: e.r, c: lin(e.c, 1.4) })),
    ],
  };
}

// Lights for this frame: the nearest fixed lights plus whatever is flashing, burning or flying.
function addLight(x, y, r, c, i, h = 0.6) { if (dyn.length < 6) dyn.push({ p: [x, h, y], r, c: lin(c, i * 1.6) }); }
function frameLights(eye) {
  const near = G.lights
    .map((l) => ({ l, d: (l.p[0] - eye[0]) ** 2 + (l.p[2] - eye[2]) ** 2 }))
    .sort((a, b) => a.d - b.d).slice(0, 16 - dyn.length).map((x) => x.l);
  const out = [...dyn, ...near];
  dyn.length = 0;
  return out;
}

// ---------- rays and sight ----------
const hit = { dist: 0, side: 0, c: '#', u: 0, mx: 0, my: 0 };
function castRay(ox, oy, dx, dy) {
  let mx = Math.floor(ox), my = Math.floor(oy);
  const ddx = dx === 0 ? 1e30 : Math.abs(1 / dx), ddy = dy === 0 ? 1e30 : Math.abs(1 / dy);
  const stepX = dx < 0 ? -1 : 1, stepY = dy < 0 ? -1 : 1;
  let sdx = dx < 0 ? (ox - mx) * ddx : (mx + 1 - ox) * ddx;
  let sdy = dy < 0 ? (oy - my) * ddy : (my + 1 - oy) * ddy;
  for (let i = 0; i < 96; i++) {
    let side;
    if (sdx < sdy) { sdx += ddx; mx += stepX; side = 0; } else { sdy += ddy; my += stepY; side = 1; }
    const c = cell(mx, my);
    if (!isWall(c) && !(isDoor(c) && doorOpen[my * mw + mx] < 0.95)) continue;
    hit.dist = side === 0 ? sdx - ddx : sdy - ddy; hit.side = side; hit.c = c; hit.mx = mx; hit.my = my;
    return hit;
  }
  hit.dist = 96; hit.c = '#';
  return hit;
}
function wallsBetween(ax, ay, bx, by, doorsBlock) {
  const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / 0.2);
  for (let i = 1; i < n; i++) {
    const t = i / n, x = Math.floor(ax + (bx - ax) * t), y = Math.floor(ay + (by - ay) * t);
    if (doorsBlock ? solid(x, y) : isWall(cell(x, y))) return true;
  }
  return false;
}
const lineOfSight = (ax, ay, bx, by) => !wallsBetween(ax, ay, bx, by, true);
const topAt = (x, y) => {
  const c = cell(x, y);
  if (isDoor(c)) return 1.7 * (1 - doorOpen[y * mw + x]);
  return x < 0 || y < 0 || x >= mw || y >= mh ? 99 : wallH[y * mw + x] + 0.12;
};

// ---------- view sizing and adaptive quality ----------
let quality = coarse ? 0.65 : 0.9, dtEma = 16, frames = 0;
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  hands.width = Math.round(innerWidth * 1.04 * dpr); hands.height = Math.round(innerHeight * 1.04 * dpr);
  if (R3) R3.resize(Math.max(320, Math.round(hands.width * quality)), Math.max(180, Math.round(hands.height * quality)));
}
addEventListener('resize', resize);
resize();
function adaptQuality(dtMs) {
  dtEma = dtEma * 0.95 + dtMs * 0.05;
  if (++frames % 90) return;
  const before = quality;
  if (dtEma > 24 && quality > 0.45) quality = Math.max(0.45, quality - 0.1);
  else if (dtEma < 17.5 && quality < 1) quality = Math.min(1, quality + 0.05);
  if (quality !== before) resize();
}

// ---------- rendering ----------
const I4 = M4.ident();
function camera() {
  if (hal.overhead) return overheadCamera(); // test robot only (__hal.overhead); never true in play
  const pitch = Math.atan(viewLook());
  const eye = [P.x, EYE + Math.sin(P.bob * 2) * 0.014 * P.bobAmp, P.y];
  const c = Math.cos(pitch), fwd = [Math.cos(P.a) * c, Math.sin(pitch), Math.sin(P.a) * c];
  const asp = view.width / view.height, plane = Math.max(0.5, Math.min(1, 0.5 * asp));
  const vfov = Math.min(1.35, 2 * Math.atan(plane / asp));
  return { eye, view: M4.lookAt(eye, [eye[0] + fwd[0], eye[1] + fwd[1], eye[2] + fwd[2]], [0, 1, 0]), proj: M4.persp(vfov, asp, 0.03, 600) };
}
/**
 * Straight down on the whole map, framed to fit, for Hal's per-level layout shots; draws what play draws. North is up,
 * except that a map wider than tall in a portrait view is turned so east is up and it fills the screen.
 */
function overheadCamera() {
  const asp = view.width / view.height, vfov = 0.9;
  const turned = mw > mh && asp < 1;
  const [across, along] = turned ? [mh, mw] : [mw, mh]; // screen width, screen height in cells
  const half = Math.max(along / 2, across / 2 / asp) * 1.06; // fit both sides, with a margin
  const h = half / Math.tan(vfov / 2) + 4;
  const eye = [mw / 2, h, mh / 2];
  return { eye, view: M4.lookAt(eye, [mw / 2, 0, mh / 2], turned ? [1, 0, 0] : [0, 0, -1]), proj: M4.persp(vfov, asp, 0.5, h + 200) };
}
function machineDraws(e, t, out) {
  const yaw = Math.PI / 2 - e.face;
  const dead = !!e.dead, mesh = MESH[e.kind];
  const look = { tint: dead ? [0.3, 0.29, 0.32] : [1, 1, 1], flash: !dead && e.flash > 0 ? 1 : 0, emi: dead ? 0 : e.atk > 0 ? 1.9 : 1 };
  const put = (m, model) => out.push({ mesh: m, model, ...look });
  if (dead) {
    // wreck: squashed, tipped and turned
    const root = M4.trs(e.x, 0.02, e.y, yaw + e.spin, 0.25, 0.18, 1.05, 0.32, 1.05);
    const lift = e.kind === 'd' ? M4.trs(0, 0.25, 0) : I4;
    for (const k in mesh) {
      if (k === 'leg') for (let i = 0; i < (e.kind === 'c' ? 6 : 2); i++) put(mesh.leg, M4.mul(root, M4.trs((i % 2 ? 1 : -1) * 0.2, 0.05, -0.15 + (i >> 1) * 0.15, i * 1.3)));
      else if (k === 'arm') for (const s of [-1, 1]) put(mesh.arm, M4.mul(root, M4.trs(s * 0.5, 0.4, 0, 0, 0, s * 1.3)));
      else put(mesh[k], M4.mul(root, lift));
    }
    return;
  }
  if (e.kind === 'd') {
    const root = M4.trs(e.x, e.hz, e.y, yaw);
    put(mesh.body, root);
    put(mesh.ring, M4.mul(root, M4.trs(0, 0, 0, t * 2.4, 0.32)));
  } else if (e.kind === 'c') {
    const root = M4.trs(e.x, 0, e.y, yaw);
    put(mesh.body, root);
    for (let i = 0; i < 6; i++) {
      const side = i < 3 ? 1 : -1, k = i % 3;
      const ph = t * 17 + k * 2.1 + (side > 0 ? 0 : Math.PI);
      const swing = Math.sin(ph) * 0.42 * e.moving, lift = Math.max(0, Math.cos(ph)) * 0.25 * e.moving;
      put(mesh.leg, M4.mul(root, M4.trs(side * 0.17, 0.15, -0.14 + k * 0.14, (side > 0 ? 0 : Math.PI) + swing, 0, lift)));
    }
  } else if (e.kind === 'b') {
    const root = M4.trs(e.x, 0, e.y, yaw), walk = Math.sin(t * 6) * 0.45 * e.moving;
    put(mesh.body, root);
    for (const s of [-1, 1]) {
      put(mesh.leg, M4.mul(root, M4.mul(M4.trs(s * 0.17, 0.48, 0, 0, s * walk), M4.trs(0, -0.48, 0))));
      const raise = s > 0 && e.atk > 0 ? -1.4 : -s * walk * 0.8;
      put(mesh.arm, M4.mul(root, M4.trs(s * 0.48, 1.02, 0, 0, raise)));
    }
  } else {
    put(mesh.body, M4.trs(e.x, 0, e.y, t * 0.4 + e.anim));
  }
}

function render(now) {
  if (!R3 || !G) return;
  const t = now / 1000, cam = camera();
  R3.begin({ eye: cam.eye, view: cam.view, proj: cam.proj, mood: hal.overhead ? { ...mood, fog: 0 } : mood, lights: frameLights(cam.eye), center: [mw / 2, 0, mh / 2], radius: Math.max(mw, mh) * 0.72 });
  const draws = [{ mesh: G.level, model: I4 }];
  for (const d of G.doors) draws.push({ mesh: DOOR_MESH[d.axis + d.kind], model: M4.trs(d.x, -doorOpen[d.y * mw + d.x] * 1.74, d.y) });
  for (const [x, y] of G.lamps) draws.push({ mesh: G.lantern, model: M4.trs(x + 0.5, 1.75 + Math.sin(t * 1.3 + x) * 0.05, y + 0.5, t * 0.6 + x), noShadow: true });
  for (const it of items) {
    const bob = 0.06 + Math.sin(t * 2.2 + it.phase) * 0.05;
    draws.push({ mesh: ITEM_MESH[it.kind], model: M4.trs(it.x, it.kind === 'k' ? 0.3 + bob : bob, it.y, t * 1.6 + it.phase) });
  }
  for (const e of enemies) machineDraws(e, t, draws);
  R3.shadows(draws);
  R3.sky(t);
  draws.push({ mesh: G.scenery, model: I4 });
  draws.push({ mesh: MESH.armillary, model: M4.trs(mw / 2 + 40, 34, mh / 2 - 75, t * 0.04, 0.35, 0.2) });
  R3.draw(draws);

  // glows, sparks and smoke
  const bb = [];
  const lampC = lin(mood.lamp, 0.55);
  for (const [x, y] of G.lamps) bb.push({ p: [x + 0.5, 1.75, y + 0.5], size: 0.45, c: lampC, a: 0.22, add: 1 });
  for (const e of G.emitters) bb.push({ p: e.p, size: e.kind === 'exit' ? 1.1 : 0.7, c: lin(e.c, 0.35), a: 0.3, add: 1 });
  for (const p of presses) {
    // Brass plate: dim while resting, hot orange while warning, a white-gold flash on the slam.
    const st = pressState(levelTime, p.x), pos = [p.x + 0.5, 0.06, p.y + 0.5];
    if (st === 'open') bb.push({ p: pos, size: 0.7, c: [0.9, 0.62, 0.2], a: 0.1, add: 1 });
    else if (st === 'warn') bb.push({ p: pos, size: 1.15, c: [2.6, 0.7, 0.15], a: 0.85, add: 1 });
    else bb.push({ p: [pos[0], 0.3, pos[2]], size: 1.5, c: [3, 2.4, 1.2], a: 1, add: 1 });
  }
  if (P.key) {
    // Key in hand: each exit arch glows brass and a slow ring of small cogs turns around it.
    for (const e of G.emitters) {
      if (e.kind !== 'exit') continue;
      const pulse = 0.85 + Math.sin(t * 2) * 0.15;
      bb.push({ p: e.p, size: 2.6 * pulse, c: [1.5, 0.95, 0.3], a: 0.55, add: 1 });
      for (let i = 0; i < 8; i++) {
        const ang = t * 0.6 + i * Math.PI / 4;
        bb.push({ p: [e.p[0] + Math.cos(ang) * 0.75, e.p[1], e.p[2] + Math.sin(ang) * 0.75], size: 0.16, c: [2.2, 1.4, 0.4], a: 0.9, add: 1 });
      }
    }
  }
  if (hal.overhead) {
    // Hal's layout shots: a bright marker over each live machine (red), repair crystal (green) and key (gold), so a
    // placement change reads at a glance from above. Never drawn in play.
    for (const e of enemies) if (!e.dead && !e.prop) bb.push({ p: [e.x, 3, e.y], size: 1.6, c: [4, 0.35, 0.25], a: 1, add: 1 });
    for (const it of items) if (it.kind === 'h' || it.kind === 'k') bb.push({ p: [it.x, 3, it.y], size: 1.3, c: it.kind === 'h' ? [0.4, 4, 0.8] : [4, 3, 0.3], a: 1, add: 1 });
  }
  for (const s of shots) {
    bb.push({ p: [s.x, 0.55, s.y], size: 0.1, c: [3, 1.8, 0.8], add: 1 });
    bb.push({ p: [s.x, 0.55, s.y], size: 0.36, c: [1.4, 0.5, 0.15], a: 0.8, add: 1 });
  }
  for (const f of fx) {
    const age = 1 - f.life / f.max, p = [f.x, f.z, f.y];
    if (f.kind === 'smoke') bb.push({ p, size: f.scale * (1 + age * (f.grow || 1)) * 0.75, c: [0.5, 0.49, 0.48], a: 0.5 * (1 - age) });
    else if (f.kind === 'steam') bb.push({ p, size: f.scale * (1 + age * (f.grow || 1)), c: [0.95, 0.86, 0.66], a: 0.55 * (1 - age) });
    else if (f.kind === 'cog') bb.push({ p, size: f.scale, c: [1.6, 1.05, 0.3], a: 1 - age * age });
    else if (f.kind === 'debris') bb.push({ p, size: f.scale * 0.5, c: [0.12, 0.12, 0.14], a: 1 });
    else if (f.kind === 'boom') bb.push({ p, size: f.scale * (1 - age * 0.4), c: [2.4, 1.3, 0.5], a: 1 - age, add: 1 });
    else bb.push({ p, size: f.scale * 0.7, c: f.kind === 'cyan' ? [1, 2.2, 2.6] : [2.6, 1.5, 0.6], a: 1, add: 1 });
  }
  R3.billboards(bb);

  const tips = drawViewmodel();
  drawHands(tips);
}

// The gun: a 3D model held low and right, angled slightly inward, its bore aimed down the crosshair.
function drawViewmodel() {
  if ((mode !== 'play' && mode !== 'paused') || hal.overhead) return null; // no gun in Hal's overhead layout shots
  const amp = P.bobAmp, rc = P.recoil * P.recoil;
  const pos = [
    0.13 + Math.sin(P.bob) * 0.007 * amp + P.swayX * 0.22,
    0.066 + Math.abs(Math.cos(P.bob)) * 0.007 * amp + P.swayY * 0.22 + rc * 0.008,
    0.285 - rc * 0.04,
  ];
  const al = Math.hypot(pos[0], pos[1], 30 - pos[2]), aim = [-pos[0] / al, -pos[1] / al, (30 - pos[2]) / al];
  const { data, tips } = gunTriangles(GUNS[P.weapon], {
    pos, yaw: Math.atan2(aim[0], aim[2]) - 0.22 - P.swayX * 0.5, pitch: Math.asin(-aim[1]) + P.swayY * 0.4, roll: -0.1 - P.swayX * 0.6,
    kick: rc * (P.weapon ? 0.32 : 0.45),
  });
  const asp = view.width / view.height;
  const f = Math.min(1, asp * 1.25) * 0.95, fovy = 2 * Math.atan(0.5 / f);
  const proj = M4.persp(fovy, asp, 0.01, 10);
  const flash = P.flash > 0 ? { p: [tips[0][0], tips[0][1], tips[0][2] + 0.05], r: 0.9, c: [5, 3.4, 1.6] } : null;
  R3.viewmodel(data, proj, flash);
  return tips.map((p) => {
    const q = M4.apply(proj, p);
    return [(q[0] * 0.5 + 0.5) * hands.width, (0.5 - q[1] * 0.5) * hands.height];
  });
}

function drawHands(tips) {
  const cw = hands.width, ch = hands.height;
  hctx.clearRect(0, 0, cw, ch);
  if (!tips) return;
  hctx.globalCompositeOperation = 'lighter';
  if (P.flash > 0) {
    const size = ch * (P.weapon ? 0.16 : 0.13) * (0.8 + Math.random() * 0.4);
    for (const [fx2, fy2] of tips) {
      const rg = hctx.createRadialGradient(fx2, fy2, 1, fx2, fy2, size);
      rg.addColorStop(0, 'rgba(255,255,240,1)');
      rg.addColorStop(0.25, 'rgba(255,190,90,.9)');
      rg.addColorStop(1, 'rgba(255,120,0,0)');
      hctx.fillStyle = rg;
      hctx.fillRect(fx2 - size, fy2 - size, size * 2, size * 2);
      hctx.save(); hctx.translate(fx2, fy2); hctx.rotate(P.flashRot);
      hctx.fillStyle = 'rgba(255,215,150,.8)';
      for (let i = 0; i < 5; i++) {
        hctx.rotate((Math.PI * 2) / 5);
        hctx.beginPath(); hctx.moveTo(-size * 0.06, 0); hctx.lineTo(0, -size * 0.95); hctx.lineTo(size * 0.06, 0); hctx.fill();
      }
      hctx.restore();
    }
  }
  if (P.tracer > 0) {
    const [tx0, ty0] = tips[0], a = P.tracer / 0.07;
    const lg = hctx.createLinearGradient(tx0, ty0, cw / 2, ch / 2);
    lg.addColorStop(0, `rgba(255,225,160,${0.9 * a})`); lg.addColorStop(1, 'rgba(255,225,160,0)');
    hctx.strokeStyle = lg; hctx.lineWidth = Math.max(2, ch * 0.005); hctx.lineCap = 'round';
    hctx.beginPath(); hctx.moveTo(tx0, ty0); hctx.lineTo(cw / 2, ch / 2); hctx.stroke();
  }
  hctx.globalCompositeOperation = 'source-over';
  if (P.hitMark > 0) {
    const a = P.hitMark / 0.26, grow = 1 - a, r0 = ch * (0.014 + 0.006 * grow), r1 = ch * (0.032 + 0.008 * grow);
    // Brass ring snaps outward behind the four ticks.
    hctx.strokeStyle = P.hitKill ? `rgba(255,90,60,${a * 0.8})` : `rgba(235,185,90,${a * 0.8})`;
    hctx.lineWidth = Math.max(2, ch * 0.003);
    hctx.beginPath(); hctx.arc(cw / 2, ch / 2, r0 * 0.9, 0, Math.PI * 2); hctx.stroke();
    hctx.strokeStyle = P.hitKill ? `rgba(255,70,50,${a})` : `rgba(255,214,130,${a})`;
    hctx.lineWidth = Math.max(2.5, ch * 0.005); hctx.lineCap = 'round';
    hctx.beginPath();
    for (const [sx2, sy2] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) { hctx.moveTo(cw / 2 + sx2 * r0, ch / 2 + sy2 * r0); hctx.lineTo(cw / 2 + sx2 * r1, ch / 2 + sy2 * r1); }
    hctx.stroke();
  }
  const cx = cw / 2, cy = ch / 2, s = Math.max(4, ch * 0.009), gap = s * 0.8;
  hctx.strokeStyle = 'rgba(0,0,0,.5)'; hctx.lineWidth = Math.max(3, s * 0.5);
  const cross = () => { hctx.beginPath(); for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { hctx.moveTo(cx + dx * gap, cy + dy * gap); hctx.lineTo(cx + dx * (gap + s), cy + dy * (gap + s)); } hctx.stroke(); };
  cross();
  hctx.strokeStyle = 'rgba(255,240,220,.9)'; hctx.lineWidth = Math.max(1.5, s * 0.22);
  cross();
}

// ---------- movement and collision ----------
function blocked(x, y, r) {
  return solid(Math.floor(x - r), Math.floor(y - r)) || solid(Math.floor(x + r), Math.floor(y - r))
    || solid(Math.floor(x - r), Math.floor(y + r)) || solid(Math.floor(x + r), Math.floor(y + r));
}
function bumpsEnemy(x, y, self) {
  for (const e of enemies) {
    if (e.dead || e === self) continue;
    const r = e.radius + (self ? self.radius : 0.25);
    if ((e.x - x) ** 2 + (e.y - y) ** 2 < r * r) return true;
  }
  return false;
}
function tryMove(o, dx, dy, r) {
  if (!blocked(o.x + dx, o.y, r) && !(o === P && bumpsEnemy(o.x + dx, o.y, null))) o.x += dx;
  else if (o === P && Math.abs(dx) > Math.abs(dy)) slideCorner(o, dx, 0, r);
  if (!blocked(o.x, o.y + dy, r) && !(o === P && bumpsEnemy(o.x, o.y + dy, null))) o.y += dy;
  else if (o === P && Math.abs(dy) > Math.abs(dx)) slideCorner(o, 0, dy, r);
}
// Blocked right beside an opening (a doorway or corridor)? Ease sideways round the corner into it.
function slideCorner(o, dx, dy, r) {
  for (const s of [0.05, -0.05, 0.1, -0.1, 0.16, -0.16]) {
    const ox = dy ? s : 0, oy = dx ? s : 0;
    if (blocked(o.x + ox, o.y + oy, r) || blocked(o.x + ox + dx, o.y + oy + dy, r)) continue;
    const k = Math.min(1, (Math.abs(dx) + Math.abs(dy)) * 12);
    o.x += ox * k; o.y += oy * k;
    return;
  }
}

// ---------- effects ----------
// Effects (particles, smoke, shake, wreck spin, muzzle flash, noise) draw from their own random stream, never the
// gameplay one, so a purely visual change can't reshuffle what enemies do. The robot's hook seeds both streams.
const fxRng = { next: () => Math.random() };
const frand = () => fxRng.next();
const rand = (a, b) => a + frand() * (b - a);
function particle(p) { if (fx.length < 320) fx.push({ z: 0, vx: 0, vy: 0, vz: 0, grav: 0, bounce: 0, ...p, max: p.life }); }
function sparks(x, y, z, n, kind = 'ember') {
  for (let i = 0; i < n; i++) {
    const a = frand() * Math.PI * 2, s = rand(1, 3.5);
    particle({ x, y, z, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: rand(0.5, 3), grav: 9, bounce: 0.35, life: rand(0.25, 0.6), kind, scale: rand(0.03, 0.05) });

function update(dt) {

  P.vy += ((sy * fwd + cx * str) * maxSp - P.vy) * k;
  const ox = P.x, oy = P.y;
  tryMove(P, P.vx * dt, P.vy * dt, 0.25);
  if (Math.abs(P.x - ox) < Math.abs(P.vx * dt) * 0.5) P.vx *= 0.5; // slid into a wall
  if (Math.abs(P.y - oy) < Math.abs(P.vy * dt) * 0.5) P.vy *= 0.5;
  const speed = Math.hypot(P.vx, P.vy);
  P.bob += dt * speed * 2.5;
  P.bobAmp += (Math.min(1, speed / 3.6) - P.bobAmp) * (1 - Math.exp(-dt * 8));

  // Gun sway: lags behind turning, pitching and strafing.
  const yawRate = (P.a - a0) / Math.max(dt, 1e-3), pitchRate = (P.look - l0) / Math.max(dt, 1e-3);
  const strafeV = -sy * P.vx + cx * P.vy, ks = 1 - Math.exp(-dt * 9);
  P.swayX += (Math.max(-0.06, Math.min(0.06, -yawRate * 0.012 - strafeV * 0.006)) - P.swayX) * ks;
  P.swayY += (Math.max(-0.05, Math.min(0.05, pitchRate * 0.03)) - P.swayY) * ks;

  P.cd -= dt; P.flash -= dt; P.tracer -= dt; P.hitMark -= dt; P.recoil = Math.max(0, P.recoil - dt * 5);
  if (fireHeld && P.cd <= 0) fire();
  if (P.flash > 0) addLight(P.x + cx * 0.5, P.y + sy * 0.5, P.weapon ? 6 : 5.5, [1, 0.7, 0.35], P.weapon ? 1.6 : 1.4);
  updateWorld(dt);
  if (mode !== 'play') return;
  updateEnemies(dt);
  updateShots(dt);
  noiseRadius = Math.max(0, noiseRadius - dt * 30);
  lockedNag -= dt;
  msgTime -= dt; if (msgTime <= 0) $('msg').hidden = true;
  hurtFx = Math.max(0, hurtFx - dt * 1.8); glowFx = Math.max(0, glowFx - dt * 3); keyFx = Math.max(0, keyFx - dt * 1.4);
  $('hurt').style.opacity = String(hurtFx);
  hitFx = Math.max(0, hitFx - dt * 1.2);
  $('hitdir').style.opacity = String(Math.min(1, hitFx * 1.5));
  $('glow').style.opacity = String(glowFx);
  $('keyglow').style.opacity = String(keyFx);
  updateHud();
  updateCompass();
}

const worldEl = $('world');
let last = 0, shaking = false;
function loop(now) {
  if (HAL && !hal.live) { last = now; requestAnimationFrame(loop); return; } // test hook drives update(); see the hal hook block
  const dtMs = now - last, dt = Math.min(0.05, dtMs / 1000 || 0);
  last = now;
  if (mode === 'play') update(dt);
  else if (mode === 'title') { P.a += dt * 0.1; P.look += (0.1 - P.look) * 0.02; }
  if (mode !== 'paused') updateFx(dt);
  shake = Math.max(0, shake - dt * 2.5);
  if (shake > 0.01) {
    const s = shake * shake * Math.min(innerWidth, innerHeight) * 0.025;
    worldEl.style.transform = `translate(${rand(-s, s)}px, ${rand(-s, s)}px)`;
    shaking = true;
  } else if (shaking) { worldEl.style.transform = ''; shaking = false; }
  render(now);
  if (dtMs > 0 && dtMs < 200) adaptQuality(dtMs);
  requestAnimationFrame(loop);
}

const overlay = $('overlay');
function showOverlay(title, tag, detail, stats, buttons) {
  $('title').textContent = title;
  $('tag').textContent = tag;
  $('detail').textContent = detail;
  $('stats').textContent = stats;
  const box = $('levels');
  box.replaceChildren();
  for (const [label, action, alt] of buttons) {
    const b = document.createElement('button');
    b.textContent = label;
    if (alt) b.className = 'alt';
    b.addEventListener('click', () => { wakeAudio(); action(); });
    box.append(b);
  }
  $('help').textContent = coarse
    ? 'Left thumb: move. Drag on the right: aim (left, right, up, down). FIRE to shoot, SWAP to change weapon.'
    : 'Mouse: aim. WASD: move. Click or Space: fire. 1 / 2: weapon. Shift: run. Arrows, R / F: turn and look without a mouse. Esc: pause.';
  overlay.hidden = false;
  $('hud').hidden = true;
  $('touchui').hidden = true;
  $('msg').hidden = true;
  $('hurt').style.opacity = '0'; keyFx = 0; $('keyglow').style.opacity = '0';
  hitFx = 0; $('hitdir').style.opacity = '0';
}

// A fresh start drops any checkpoint; startLevel(i, cp) respawns at that gear-key checkpoint instead.
function startLevel(i, cp = null) {
  if (cp) applyCheckpoint(cp);
  else { setCheckpoint(null); loadLevel(i); }
  mode = 'play';
  overlay.hidden = true;
  $('hud').hidden = false;
  if (coarse) $('touchui').hidden = false;
  hudKey = '';
  updateHud();
  say(cp ? 'Rebooted at the gear key.' : LEVELS[i].hint);
  lockPointer();
  studio.track('level_start', cp ? { level: i + 1, checkpoint: true } : { level: i + 1 });
}

function resume() {
  mode = 'play';
  overlay.hidden = true;
  $('hud').hidden = false;
  if (coarse) $('touchui').hidden = false;
  lockPointer();
}

function pause() {
  if (mode !== 'play') return;
  mode = 'paused';
  fireHeld = false;
  if (document.pointerLockElement) document.exitPointerLock();
  pauseMenu();
}
function setSens(v) {
  sens = Math.round(Math.max(0.3, Math.min(3, v)) * 10) / 10;
  try { localStorage.setItem('gearhold.sens', String(sens)); } catch { /* memory only */ }
  pauseMenu();
}
function pauseMenu() {
  showOverlay('PAUSED', `${level + 1} · ${LEVELS[level].name}`, `Aim sensitivity ${sens.toFixed(1)}`, `Integrity ${P.hp} · scrapped ${kills}/${foes}`, [
    ['Resume', resume],
    ['Aim −', () => setSens(sens - 0.1), true],
    ['Aim +', () => setSens(sens + 0.1), true],
    ['Restart level', () => { studio.track('level_end', { level: level + 1, result: 'quit', kills, secs: Math.round(levelTime) }); startLevel(level); }, true],
  ]);
}

const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function endLevel(result) {
  if (mode !== 'play') return;
  mode = result === 'win' ? 'won' : 'dead';
  fireHeld = false;
  if (document.pointerLockElement) document.exitPointerLock();
  studio.track('level_end', { level: level + 1, result, kills, total: foes, secs: Math.round(levelTime) });
  const stats = `Scrapped ${kills}/${foes} · time ${clock(levelTime)}`;
  if (result === 'win') {
    sfx.exit();
    setCheckpoint(null);
    if (level + 1 < LEVELS.length) {
      saveUnlocked(level + 1);
      showOverlay('SECTOR CLEAR', `next: ${LEVELS[level + 1].name}`, LEVELS[level + 1].hint, stats, [['Next level', () => startLevel(level + 1)]]);
    } else {
      showOverlay('CITADEL RESTORED', 'the gears turn true', 'Every rogue machine is scrap and Gearhold drifts quietly above the clouds again. Nice work, repair unit.', stats, [['Play again', () => startLevel(0)]]);
    }
  } else {
    const cp = checkpoint && checkpoint.level === level ? checkpoint : null;
    showOverlay('WRECKED', 'chassis failure', cp ? 'Your chassis gave out. Reboot at the gear key, or start the sector over.' : 'Your chassis gave out. Reboot and try that sector again.', stats, cp
      ? [['Reboot at gear key', () => startLevel(level, cp)], ['Restart level', () => startLevel(level), true], ['Title', title, true]]
      : [['Try again', () => startLevel(level)], ['Title', title, true]]);
  }
  studio.feedback.maybePrompt();
}

function title() {
  mode = 'title';
  if (!R3) {
    showOverlay('GEARHOLD', 'needs WebGL 2', 'This game draws its world in 3D with WebGL 2, which this browser does not offer. Try a current Chrome, Edge, Firefox or Safari.', '', []);
    return;
  }
  loadLevel(unlocked);
  const buttons = [];
  if (checkpoint) buttons.push([`Continue: ${LEVELS[checkpoint.level].name} (gear key)`, () => startLevel(checkpoint.level, checkpoint)]);
  buttons.push([unlocked > 0 ? `${checkpoint ? 'Start' : 'Continue'}: ${LEVELS[unlocked].name}` : 'Play', () => startLevel(unlocked), !!checkpoint]);
  for (let i = 0; i < unlocked; i++) buttons.push([`${i + 1} · ${LEVELS[i].name}`, () => startLevel(i), true]);
  showOverlay('GEARHOLD', 'the clockwork citadel', 'Gearhold floats above a sea of clouds, kept turning by its caretaker machines. They have gone rogue and sealed the halls. You are the last repair unit online: scrap them and reach the exit arches.', '', buttons);
}

// ---- hal hook (test only; inert without ?hal) ----
// A headless robot drives the game through window.__hal. step() runs the game's own update(dt) with the
// controls given instead of the keyboard; the rAF loop above does nothing in this mode. Math.random is
// replaced with a seeded generator (?hal=<seed>, default 1) and reseeded on every start(), so a run is
// repeatable. Nothing here touches the network: the SDK was created in no-ingest mode above.
// ?hal=<seed>&live is the real-input mode for the controls check: the rAF loop above runs update() with the
// real keyboard, mouse and touch, pauses stay suppressed, state() works, and step() throws.
if (HAL) {
  hal.live = new URLSearchParams(location.search).has('live');
  const seedRaw = new URLSearchParams(location.search).get('hal');
  const seedArg = seedRaw !== null && seedRaw !== '' && Number.isInteger(Number(seedRaw)) ? Number(seedRaw) : 1; // any integer incl. 0; 1 when absent/empty
  const seeded = (a) => () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  let rng = seeded(seedArg);
  const fxSeed = (seedArg ^ 0x5bd1e995) | 0; // effects get their own stream (see fxRng)
  fxRng.next = seeded(fxSeed);
  const nativeRandom = Math.random; // render() must not consume the seeded stream
  Math.random = rng;
  const num = (v) => (Number.isFinite(v) ? v : 0);
  const state = () => ({
    mode, level, time: levelTime,
    p: { x: P.x, y: P.y, a: P.a, look: P.look, hp: P.hp, shells: P.shells, key: P.key, weapon: P.weapon },
    enemies: enemies.map((e) => ({ kind: e.kind, x: e.x, y: e.y, hp: e.hp, awake: e.awake, dead: e.dead, prop: !!e.prop })),
    items: items.map((it) => ({ kind: it.kind, x: it.x, y: it.y })),
    doors: grid.flatMap((c, i) => (isDoor(c) ? [{ x: i % mw, y: Math.floor(i / mw), open: doorOpen[i] }] : [])), // cell coords; open 0..1, passable at >= 0.95
    kills, foes, shotsFired: hal.shots, hits: hal.hits, damageTaken: hal.dmg, damageUnseen: hal.unseen,
    result: mode === 'won' ? 'win' : mode === 'dead' ? 'dead' : '',
  });
  window.__hal = {
    start(i) {
      Math.random = rng = seeded(seedArg);
      fxRng.next = seeded(fxSeed);
      hal.shots = hal.hits = hal.dmg = hal.unseen = 0;
      for (const k in keys) keys[k] = false;
      fireHeld = false; mouseDX = mouseDY = 0;
      loadLevel(i);
      mode = 'play';
      overlay.hidden = true;
      $('hud').hidden = false;
      hudKey = '';
      updateHud();
    },
    state,
    // Precondition, not input: own the scatter cannon (as its pickup does, minus the auto-switch) so the real
    // swap inputs (Digit1 / Digit2, tapping SWAP) can be checked from a level start. Hal mode only.
    grant(item, shells = 8) {
      if (item !== 'scatter') throw new Error(`hal: cannot grant ${item}`);
      P.scatter = true; P.shells = Math.max(0, Math.min(50, Math.floor(num(shells))));
      hudKey = ''; updateHud();
    },
    step(dt, input) {
      if (hal.live) throw new Error('hal: step() is unavailable in live mode (the rAF loop runs update with real input)');
      if (mode === 'won' || mode === 'dead') return state();
      if (mode !== 'play') throw new Error(`hal: game not running (mode=${mode})`);
      dt = Math.min(0.05, dt);
      const inp = input || {};
      keys.KeyW = inp.fwd > 0; keys.KeyS = inp.fwd < 0;
      keys.KeyD = inp.str > 0; keys.KeyA = inp.str < 0;
      fireHeld = !!inp.fire;
      // weapon 1 only while owned and loaded, so a policy that keeps sending 1 falls back to weapon 0 when dry
      if (inp.weapon === 0) P.weapon = 0;
      else if (inp.weapon === 1 && P.scatter && P.shells > 0) P.weapon = 1;
      P.a += num(inp.turn);
      P.look = Math.max(-LOOK_MAX, Math.min(LOOK_MAX, P.look + num(inp.pitch)));
      update(dt);
      updateFx(dt);
      return state();
    },
    render() { Math.random = nativeRandom; try { render(performance.now()); } finally { Math.random = rng; } },
    // Layout shots: the camera looks straight down on the whole level (on) or is the player's again (off).
    // Rendering only; update() and the robot's inputs are unchanged.
    overhead(on = true) {
      hal.overhead = !!on;
      for (const id of ['hands', 'hud', 'vignette', 'hurt', 'glow', 'msg', 'touchui']) { const n = $(id); if (n) n.style.visibility = hal.overhead ? 'hidden' : ''; }
    },
    levels() { return LEVELS.length; },
  };
}
// ---- end hal hook ----

title();
requestAnimationFrame(loop);
</script>
</body>
</html>
