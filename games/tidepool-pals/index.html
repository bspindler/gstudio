/* ---------- booster tray (from level 3): tap one to pick it, tap again to use it now ---------- */
let armedBoost = null, armT = 0;
const BOOST_ICON = { moves3: `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="url(#twave)"/><text x="20" y="27" text-anchor="middle" font-family="Bagel Fat One, sans-serif" font-size="18" fill="#fff">+3</text></svg>` };
const BOOST_NAME = { moves3: '+3 moves', bomb: 'Urchin', wave: 'Wave' };
function renderTray() {
  const tray = $('tray');
  const show = !!lvl && !lvl.over && !lvl.preview && lvl.n >= 3;
  if (tray.hidden === show) { tray.hidden = !show; fitBelow(); }
  if (!show) { armedBoost = null; return; }
  tray.innerHTML = `<div class="trayhead"><b>Need a hand?</b><span>Uses pearls · no shell this level</span></div>
    <div class="tbs">${BOOSTERS.map((b) => {
      const on = armedBoost === b.id, can = S.pearls >= b.pearls && !busy;
      return `<button class="tb" data-act="tray" data-id="${b.id}" aria-pressed="${on}" ${can ? '' : 'disabled'} aria-label="${BOOST_NAME[b.id]}, ${b.pearls} pearls${on ? '. Tap again to use it' : ''}"><span class="bi">${BOOST_ICON[b.id] || (b.id === 'bomb' ? BOMB : WAVE_H)}</span><span class="bt">${on ? 'Tap to use' : BOOST_NAME[b.id]}<span class="bp">${PEARL}${b.pearls}</span></span></button>`;
    }).join('')}</div>`;
}
function trayTap(id) {
  if (!lvl || lvl.over || lvl.preview || busy) return;
  clearTimeout(armT);
  if (armedBoost !== id) { armedBoost = id; sfx.tap(); renderTray(); armT = setTimeout(() => { armedBoost = null; renderTray(); }, 3000); return; }
  armedBoost = null;
  const b = BOOSTERS.find((x) => x.id === id);
  if (!useBooster(S, lvl, id)) { toast('Not enough pearls for that'); renderTray(); return; }
  ev('booster_used', { level: lvl.n, booster: id, pearls: b.pearls, when: 'in_play' });
  persist();
  if (id === 'moves3') { lvl.moves += 3; bumpEl($('movesBox')); }
  else {
    const at = freeCell();
    if (at) {
      grid[at[0]][at[1]] = { id: newId(), k: 'sp', s: id === 'bomb' ? 'bomb' : 'wave-h', c: 0 };
      render();
      els.get(grid[at[0]][at[1]].id)?.classList.add('pop-in');
      floatAt(at[0], at[1], BOOST_NAME[id] + '!');
    }
  }
  sfx.tap();
  pearlsChanged();
  armIdle();
}

/* ---------- collection ---------- */
function setDone(i) { return CREATURES.filter((c) => c.set === i).every((c) => S.album[c.id]); }
/** Earned shells only. Rarity first, then a uniform pick within that rarity, both via studio.odds.roll. */
function roll() {
  const rar = studio.odds.roll(RARITY_ODDS).rar;
  const pool = CREATURES.filter((c) => c.rar === rar);
  const cr = studio.odds.roll(pool.map((c) => ({ label: c.name, weight: 1 / pool.length, cr: c }))).cr;
  const r = addPal(S, cr.id); persist();
  return { cr, ...r };
}
function offerShell() {
  showModal(`<div class="label">${ctx === 'win' ? 'Your reward' : 'Saved shell'}</div><h2>Something's inside…</h2>
  <button class="shellbtn" data-act="crack" aria-label="Open the shell">${SHELL}</button><p class="muted">Tap the shell to open it</p>
  <p class="fine">${oddsLine()}</p>`);
}
function showResult({ cr, dup, n }) {
  const done = setDone(cr.set) && !S.claimed[cr.set];
  showModal(`${dup ? '' : confetti()}<div class="newtag">${dup ? 'Again!' : 'New pal!'}</div>
    <div class="reveal">${creatureSVG(cr, false)}</div>
    <h2>${cr.name}</h2><div><span class="rar ${cr.rar}">${cr.rar}</span> <span class="muted">· ${SETS[cr.set].name}</span></div>
    <p class="muted">${dup ? `You have ${n} now. Duplicates give +25 pearls and a sand dollar.` : `Added to your album, and ${cr.name} moved into your home pool.`}${done ? ` <b style="color:var(--sand)">Set complete! Claim ${SETS[cr.set].reward} pearls in the Album.</b>` : ''}</p>
    <div class="row">${ctx === 'win'
      ? `<button class="btn buy" data-act="next">Next level</button><button class="btn ghost" data-act="go-album">View album</button>`
      : `${S.shells > 0 ? `<button class="btn buy" data-act="open-shell">Open another (${S.shells} left)</button>` : ''}<button class="btn ghost" data-act="close">Done</button>`}</div>`);

  const w = v.width * W, h = v.height * H;

/* ---------- input ---------- */
/* Swipe input: press a tile, drag about a third of a tile toward a neighbour and it swaps that way. A press that never
   travels is a tap (it aims a helper). Arrow keys on a focused tile swap it too. */
{
  let drag = null;
  const lean = () => tilesEl.clientWidth / COLS * 0.3;
  tilesEl.addEventListener('pointerdown', (e) => {
    if (lvl && !lvl.over) armIdle(); // any touch ends the nudge hint and restarts the idle wait
    const t = e.target.closest('.tile');
    if (!t || t.disabled || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag = { el: t, x: e.clientX, y: e.clientY, id: e.pointerId, moved: false };
    try { tilesEl.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
  });
  // While the finger drags, the pressed pal follows it (up to 0.4 of a tile) and its neighbour slides the other way.
  const CAP = 0.4;
  const rest = (d) => {
    if (!d.vis) return;
    const { el, nb } = d.vis; d.vis = null;
    el.classList.remove('now'); if (nb) nb.classList.remove('now');
    if (el._r != null) place(el, el._r, el._c);
    if (nb && nb._r != null) place(nb, nb._r, nb._c);
  };
  const follow = (d, dr, dc, f) => {
    const el = d.el, r = el._r, c = el._c;
    const g = grid[r + dr]?.[c + dc];
    const nb = g ? els.get(g.id) : null;
    if (!nb || nb._dying || !grid[r][c] || isFixed(grid[r][c]) || isFixed(g)) { rest(d); return; }
    if (d.vis && d.vis.nb !== nb) rest(d);
    d.vis = { el, nb };
    el.classList.add('now'); nb.classList.add('now');
    const o = Math.min(f, CAP) * 100;
    el.style.transform = `translate(${c * 100 + dc * o}%,${r * 100 + dr * o}%)`;
    nb.style.transform = `translate(${(c + dc) * 100 - dc * o}%,${(r + dr) * 100 - dr * o}%)`;
  };
  tilesEl.addEventListener('pointermove', (e) => {
    if (!drag || drag.moved || e.pointerId !== drag.id) return;
    if (busy || !lvl || lvl.over || aiming) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    const horiz = Math.abs(dx) >= Math.abs(dy);
    const dr = horiz ? 0 : dy > 0 ? 1 : -1, dc = horiz ? (dx > 0 ? 1 : -1) : 0;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < lean()) {
      const dist = horiz ? Math.abs(dx) : Math.abs(dy);
      if (dist < 3) rest(drag); else follow(drag, dr, dc, dist / lean() * CAP); // reaches the 0.4-tile cap just as the swap triggers
      return;
    }
    drag.moved = true;
    rest(drag);
    onSwipe(drag.el, dr, dc);
  });
  const end = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    rest(d);
    if (!d.moved && e.type === 'pointerup') onTileTap(d.el);
  };
  tilesEl.addEventListener('pointerup', end);
  tilesEl.addEventListener('pointercancel', end);
  const ARROWS = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] };
  tilesEl.addEventListener('keydown', (e) => {
    const t = e.target.closest('.tile'), d = ARROWS[e.key];
    if (t && d && !t.disabled) { e.preventDefault(); onSwipe(t, d[0], d[1]); }
    else if (t && (e.key === 'Enter' || e.key === ' ') && !t.disabled) { e.preventDefault(); onTileTap(t); }
  });
}

    case 'decor': {
      const d = DECOR.find((x) => x.id === b.dataset.id);
      if (buyDecor(S, d.id)) { persist(); sfx.coin(); ev('decor_bought', { decor: d.id, pearls: d.pearls }); pearlsChanged(); renderPool(); toast(`${d.name} placed in your pool`); }
      break;
    }
    case 'pet': { b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin'); sfx.pop(4 + Math.floor(Math.random() * 4)); const cr = CREATURES.find((c) => c.id === b.dataset.id); toast(`${cr.name} says hi!`); break; }
  }
});

/* ---------- reef, home pool photo and field-notes input (kept apart from the main handler) ---------- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act^="reef-"]'); if (!b || b.disabled) return;
  switch (b.dataset.act) {
    case 'reef-toggle': { const p = +b.dataset.p; reefOpen = (reefOpen ?? poolOf(S.level)) === p ? -1 : p; sfx.tap(); renderMap(); break; }
    case 'reef-next': showReefCard(); break;
    case 'reef-notes': sfx.tap(); showNotes(b.dataset.id); break;
    case 'reef-photo': sfx.tap(); photoMode(true); break;
    case 'reef-photo-done': photoMode(false); break;
    case 'reef-card': b.disabled = true; showCard().finally(() => { b.disabled = false; }); break;
    case 'reef-share': shareCard(); break;
    case 'reef-card-done': closeModal(); break;
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.hidden && document.body.classList.contains('photo')) photoMode(false); });

/* ---------- boot ---------- */
hud();
// A returning player opens on the reef map with Continue at their furthest unlocked level; a new player starts level 1.
{ const c = continueAt(S); if (c && c.level > S.level) { S.level = c.level; persist(); } }
showView('map');
{ const want = levelFromSearch(location.search); if (want) openLevel(want); else if (!continueAt(S)) openLevel(1); }
</script>
