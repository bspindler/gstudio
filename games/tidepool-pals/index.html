<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A2033">
<title>Tidepool Pals</title>
<style>/* Fonts are bundled in ./fonts (SIL OFL 1.1, see fonts/SOURCES.md), so the game makes no outside requests. */
@font-face{font-family:'Bagel Fat One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/bagel-fat-one-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;}
@font-face{font-family:'Bagel Fat One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/bagel-fat-one-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:'Nunito';font-style:normal;font-weight:600 900;font-display:swap;src:url(fonts/nunito-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;}
@font-face{font-family:'Nunito';font-style:normal;font-weight:600 900;font-display:swap;src:url(fonts/nunito-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
</style>
<style>
[hidden]{display:none!important}
/* One-screen phone game, single dark "underwater" theme. Layers: animated sea (rays, caustics, bubbles) behind
   the app; the app is a top bar, one view (map / board / pool / album / shop) and a tab bar. Everything that
   moves animates transform or opacity only. */
:root{
  --abyss:#0A2033; --deep:#10364D; --surf:#174C66; --reef:#1F607E;
  --foam:#EAF8F5; --mist:#94BFC9; --sand:#FFD98A; --coral:#FF6F61; --aqua:#3DDCCB; --violet:#A77BFF;
  --ink:#0A2033;
  --panel:linear-gradient(180deg,rgba(31,96,126,.92),rgba(16,54,77,.92));
  --rim:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1.5px rgba(255,255,255,.05),0 6px 16px rgba(0,0,0,.28);
  --display:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;touch-action:manipulation}
body{background:#061524;color:var(--foam);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--sand);outline-offset:2px}

/* ---------- the sea ---------- */
.sea{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#1C6A8A 0%,#123F5C 30%,#0A2033 66%,#051322 100%)}
.rays{position:absolute;left:-40%;right:-40%;top:-5%;height:70%;background:repeating-linear-gradient(98deg,rgba(220,255,250,.075) 0 5%,transparent 5% 11%,rgba(220,255,250,.04) 11% 13%,transparent 13% 21%);-webkit-mask-image:linear-gradient(#000 0%,transparent 90%);mask-image:linear-gradient(#000 0%,transparent 90%);transform-origin:50% 0;animation:sway 14s ease-in-out infinite alternate}
@keyframes sway{from{transform:skewX(-7deg)}to{transform:skewX(7deg)}}
.caustic{position:absolute;inset:-30%;opacity:.13;mix-blend-mode:screen;background-image:radial-gradient(circle at 50% 50%,transparent 38%,rgba(190,255,248,.9) 44%,transparent 50%);background-size:150px 130px;-webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%);animation:drift 26s linear infinite}
.caustic.b{background-size:190px 170px;opacity:.1;animation-duration:34s;animation-direction:reverse}
@keyframes drift{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(150px,65px,0) rotate(8deg)}}
.bub{position:absolute;bottom:-30px;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95) 0 10%,rgba(255,255,255,.12) 28%,rgba(255,255,255,.04) 58%,rgba(220,255,255,.45) 68%,transparent 71%);animation:bubrise linear infinite}
@keyframes bubrise{to{transform:translate3d(var(--wx),-112vh,0)}}

/* ---------- app shell ---------- */
.app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(10px,env(safe-area-inset-top,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-size:23px;letter-spacing:.5px;color:var(--sand);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.wallet{display:flex;align-items:center;gap:6px}
.chip{display:flex;align-items:center;gap:5px;background:var(--panel);box-shadow:var(--rim);border-radius:999px;padding:4px 11px 4px 5px;font-weight:900;font-variant-numeric:tabular-nums;font-size:15px}
.chip svg{width:22px;height:22px;display:block}
.chip.bump{animation:bump .35s}
.iconbtn{flex:none;width:40px;height:40px;border:0;border-radius:14px;background:var(--panel);box-shadow:var(--rim);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:22px;height:22px}
.iconbtn:active{transform:scale(.94)}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.scroll{overflow-y:auto;overflow-x:hidden;padding-bottom:14px;-webkit-overflow-scrolling:touch}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:stretch;gap:8px}
.hud .iconbtn{height:auto;min-height:52px}
.goals{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-around;gap:4px;background:var(--panel);box-shadow:var(--rim);border-radius:18px;padding:6px 8px}
.gchip{display:flex;align-items:center;gap:4px;min-width:0}
.gchip .gi{width:32px;height:32px;flex:none;position:relative}
.gchip .gi svg{width:100%;height:100%;display:block;overflow:visible}
.gchip b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.gchip .gw{font-size:11px;font-weight:900;color:var(--mist);line-height:1.1;max-width:62px}
.gchip.done b{color:var(--aqua)}
.gchip.bump .gi{animation:bump .35s}
.moves{flex:none;min-width:70px;text-align:center;background:var(--panel);box-shadow:var(--rim);border-radius:18px;padding:6px 10px}
.label{font-size:10.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--mist)}
.moves b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums}
.moves.low b{color:var(--coral);animation:throb .8s infinite}
@keyframes throb{50%{transform:scale(1.12)}}
@keyframes bump{40%{transform:scale(1.25)}}

/* ---------- board (pseudo-3D: a tilted slab, pieces are glossy SVG with shared gradients) ---------- */
.playzone{flex:1 1 0;min-height:0;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px}
.boardwrap{flex:none;width:min(100cqw,calc((100cqh - var(--below, 44px)) * 7 / 8));aspect-ratio:7/8;display:grid;place-items:center;perspective:900px}
.board{position:relative;width:100%;aspect-ratio:7/8;max-width:100%;transform:rotateX(var(--rx,7deg)) rotateY(var(--ry,0deg));transform-origin:50% 70%;transition:transform .5s cubic-bezier(.2,.8,.3,1)}
.slots{position:absolute;inset:0;filter:drop-shadow(0 7px 0 #04121F) drop-shadow(0 18px 18px rgba(0,0,0,.45))}
.slot{position:absolute;width:calc(100% / 7 + .5px);height:calc(100% / 8 + .5px);background:var(--tex,none),radial-gradient(circle at 50% 42%,var(--s1,#1E6584) 0 40%,var(--s1b,#16516D) 72%);background-size:100% 100%}
.slot.alt{background:var(--tex,none),radial-gradient(circle at 50% 42%,var(--s2,#1A5C7A) 0 40%,var(--s2b,#134A64) 72%);background-size:100% 100%}
.bframe{position:absolute;inset:-5px;border-radius:20px;pointer-events:none;background:var(--fc,#8A6A44);box-shadow:0 0 0 2px var(--fd,#5a4429)}
.bframe.wood{background:repeating-linear-gradient(90deg,var(--fc) 0 22%,var(--fd) 22% 23%,var(--fc) 23% 45%)}
.bframe.coral{background:radial-gradient(circle at 6px 50%,var(--fc) 0 3px,transparent 3.5px) 0 0/14px 14px,var(--fd)}
.bframe .bc{position:absolute;width:13%;aspect-ratio:1;overflow:visible}
.bframe .bc.tl{left:-4px;top:-8%}
.bframe .bc.br{right:-4px;bottom:-5%}
.tiles,.fx{position:absolute;inset:0}
.tiles{touch-action:none}
.tiles{overflow:hidden;border-radius:16px} /* refills drop in from the rim, not over the HUD */
.fx{pointer-events:none}
.tile{position:absolute;left:0;top:0;width:calc(100% / 7);height:calc(100% / 8);padding:.7%;border:0;background:none;cursor:pointer;transition:transform .32s cubic-bezier(.3,1.32,.55,1);touch-action:none;user-select:none;-webkit-user-select:none}
.tile.now{transition:none}
.tl{display:block;width:100%;height:100%;transition:transform .12s}
.tl svg,.ice svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.ice{position:absolute;inset:1%;pointer-events:none}
.tile:active .tl{transform:scale(.9)}
.tile.sp .tl{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08)}}
.tile .spin{transform-origin:20px 20px;animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tile.spawn .tl{animation:spawn .45s cubic-bezier(.34,1.7,.6,1)}
@keyframes spawn{from{transform:scale(0) rotate(-120deg)}}
.tile.hintme .tl{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(calc(var(--hx,0) * 7px),calc(var(--hy,0) * 7px))}}
@media (prefers-reduced-motion:reduce){.tile.hintme .tl{animation:none}}
@keyframes wiggle{0%,60%,100%{transform:rotate(0) scale(1)}15%{transform:rotate(-9deg) scale(1.06)}30%{transform:rotate(9deg) scale(1.06)}45%{transform:rotate(-4deg)}}
.tile.shake .tl{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-12%)}75%{transform:translateX(12%)}}
.tile.matchglow::before{content:"";position:absolute;inset:-12%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--mg,#fff) 0,transparent 68%);opacity:0;animation:mglow .26s ease-out forwards}
.tile.matchglow .tl{animation:mgpulse .26s ease-out forwards}
@keyframes mglow{to{opacity:.85;transform:scale(1.15)}}
@keyframes mgpulse{to{transform:scale(1.1)}}
.tile.pop .tl{animation:pop .22s ease-in forwards}
@keyframes pop{35%{transform:scale(1.28)}100%{transform:scale(0);opacity:0}}
.tile.crumble .tl{animation:crumble .32s ease-in forwards}
@keyframes crumble{30%{transform:scale(1.1) rotate(-6deg)}100%{transform:scale(.4) translateY(30%);opacity:0}}
.ice.thaw{animation:thaw .4s ease-out forwards}
@keyframes thaw{30%{transform:scale(1.15)}100%{transform:scale(1.5);opacity:0}}
.tile[disabled]{pointer-events:none}
/* effects */
.pt{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;animation:ptfly .55s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes ptfly{to{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}
.ring{position:absolute;width:calc(300% / 7);aspect-ratio:1;border-radius:50%;border:5px solid #F4E9FF;box-shadow:0 0 24px #C9A6FF,inset 0 0 24px #C9A6FF;transform:translate(-50%,-50%) scale(.2);animation:ring .45s ease-out forwards}
.ring.big{width:calc(500% / 7)}
@keyframes ring{to{transform:translate(-50%,-50%) scale(1.25);opacity:0}}
.beam{position:absolute;background:linear-gradient(var(--bd,180deg),transparent,rgba(200,255,250,.9) 35%,#fff 50%,rgba(200,255,250,.9) 65%,transparent);border-radius:999px;box-shadow:0 0 22px rgba(61,220,203,.9);animation:beamh .5s ease-out forwards}
.beam.h{left:-4%;width:108%;height:calc(100% / 8)}
.beam.v{top:-4%;height:108%;width:calc(100% / 7);--bd:90deg;animation-name:beamv}
@keyframes beamh{from{transform:scaleX(0)}50%{opacity:1}to{transform:scaleX(1);opacity:0}}
@keyframes beamv{from{transform:scaleY(0)}50%{opacity:1}to{transform:scaleY(1);opacity:0}}
.swirl{position:absolute;width:160%;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,transparent,var(--sc) 12%,transparent 25%,var(--sc) 37%,transparent 50%,var(--sc) 62%,transparent 75%,var(--sc) 87%,transparent);mix-blend-mode:screen;transform:translate(-50%,-50%) rotate(0) scale(.1);animation:swirl .75s ease-out forwards}
@keyframes swirl{60%{opacity:.85}to{transform:translate(-50%,-50%) rotate(300deg) scale(1);opacity:0}}
.flash{position:absolute;inset:-3%;border-radius:22px;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);animation:flash .4s ease-out forwards}
@keyframes flash{to{opacity:0}}
.float{position:absolute;pointer-events:none;font-family:var(--display);font-size:24px;color:var(--sand);text-shadow:0 2px 0 var(--ink),0 0 12px rgba(0,0,0,.4);animation:rise .85s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
@keyframes rise{to{transform:translate(-50%,-170%);opacity:0}}
.puff{position:absolute;pointer-events:none;width:calc(100% / 8);aspect-ratio:1;border-radius:50%;border:2px solid rgba(191,241,255,.8);background:radial-gradient(circle,rgba(191,241,255,.25),rgba(191,241,255,0) 70%);transform:translate(-50%,-50%) scale(.3);opacity:0;animation:puff .55s ease-out forwards}
@keyframes puff{20%{opacity:.9}to{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.shk-s{animation:shk .28s}
.shk-l{animation:shkL .5s}
@keyframes shk{20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,1px)}80%{transform:translate(2px,-1px)}}
@keyframes shkL{10%{transform:translate(-6px,3px) rotate(-.6deg)}25%{transform:translate(6px,-4px) rotate(.6deg)}40%{transform:translate(-5px,3px)}55%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
.hint{text-align:center;font-size:13px;color:var(--mist);font-weight:800;margin:8px 0 0;min-height:18px;position:relative;z-index:1}

/* ---------- booster tray: boosters live on the board, used mid-level (tap to pick, tap again to use) ---------- */
.tray{flex:none;width:100%;max-width:420px;margin-top:4px;position:relative;z-index:1}
.tray .trayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 4px 4px}
.tray .trayhead b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--sand)}
.tray .trayhead span{font-size:11px;color:var(--mist);font-weight:800;text-align:right}
.tray .tbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tb{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border:2px solid transparent;border-radius:16px;padding:6px 8px;background:var(--panel);box-shadow:var(--rim);color:var(--foam);font:900 13px var(--body);cursor:pointer;touch-action:manipulation}
.tb .bi{width:30px;height:30px;flex:none}
.tb .bi svg{width:100%;height:100%;overflow:visible}
.tb .bt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0;white-space:nowrap}
.tb .bp{display:flex;align-items:center;gap:2px;color:var(--mist);font-size:12px}
.tb .bp svg{width:13px;height:13px}
.tb[aria-pressed="true"]{border-color:var(--sand);background:rgba(255,217,138,.16);animation:armed 1s ease-in-out infinite}
.tb[aria-pressed="true"] .bp{color:var(--sand)}
.tb[disabled]{opacity:.4;cursor:not-allowed}
@keyframes armed{50%{box-shadow:0 0 0 4px rgba(255,217,138,.25)}}
@media (prefers-reduced-motion:reduce){.tb[aria-pressed="true"]{animation:none}}
.pop-in{animation:popin .5s cubic-bezier(.34,1.8,.6,1)}
@keyframes popin{from{transform:scale(0)}}

/* ---------- mission card: shown over the live board at the start of every level ---------- */
.modal.mission{background:rgba(3,12,22,.5)}
.mission .mcard{gap:10px;padding:20px 18px 16px}
.mtitle{margin:0;font-size:28px;line-height:1.1}
.mgoals{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.mg{display:flex;align-items:center;gap:8px;background:rgba(10,32,51,.55);border-radius:16px;padding:8px 12px}
.mg .gi{width:46px;height:46px;flex:none;animation:bob 1.6s ease-in-out infinite}
.mg .gi svg{width:100%;height:100%;overflow:visible}
.mg b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
.mg span{font-weight:900;font-size:13px;color:var(--mist);text-align:left;max-width:90px;line-height:1.15}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.mg .gi{animation:none}}
.mmoves{margin:0;font-weight:900;color:var(--mist)}
.mmoves b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--foam)}
.how{display:flex;align-items:center;gap:12px;background:rgba(255,217,138,.12);border:1.5px solid rgba(255,217,138,.45);border-radius:16px;padding:10px 12px;text-align:left;font-weight:800;font-size:14px}
.how .demo{position:relative;display:flex;flex:none}
.how .demo .dt{width:30px;height:30px;margin-left:-6px}
.how .demo .dt:first-child{margin-left:0}
.how .demo .dt svg{width:100%;height:100%;overflow:visible}
.how .demo .finger{position:absolute;right:-8px;bottom:-10px;width:26px;height:26px;animation:swipe 1.6s ease-in-out infinite}
@keyframes swipe{0%,15%{transform:translate(0,0)}65%,100%{transform:translate(-30px,0)}}
@media (prefers-reduced-motion:reduce){.how .demo .finger{animation:none}}
.mission .mech{text-align:left}
.mission .btn.buy{font-size:20px;min-height:56px}
.coach{position:absolute;transform:translate(-50%,-150%);pointer-events:none;z-index:5;background:var(--sand);color:var(--ink);font:400 18px var(--display);padding:6px 12px;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.25);white-space:nowrap;animation:coach 1s ease-in-out infinite}
.coach::after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--sand)}
@keyframes coach{50%{transform:translate(-50%,-170%)}}
@media (prefers-reduced-motion:reduce){.coach{animation:none}}

/* ---------- pool panel: the pal and pool this level is restoring (decoration only) ---------- */
.poolpanel{flex:0 0 auto;min-height:0;width:100%;max-width:420px;overflow:hidden;margin-top:6px}
.pp{display:flex;align-items:center;gap:10px;background:var(--panel);box-shadow:var(--rim);border-radius:16px;padding:6px 12px}
.pp{position:relative;overflow:hidden}
.pp>*{position:relative;z-index:1}
.pp>.flora{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:calc(.3 + .7*var(--bloom,0));filter:saturate(calc(.5 + .8*var(--bloom,0)));transition:opacity .8s,filter .8s}
.flora svg{position:absolute;bottom:0;height:60%;width:auto;overflow:visible;transform-origin:50% 100%}
.flora .fl{animation:florasway 5s ease-in-out infinite alternate}
.flora .fr{animation-delay:-2.5s}
@keyframes florasway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.pp .ppal{flex:none;width:40px;aspect-ratio:1;display:grid;place-items:center;animation:bob 3.2s ease-in-out infinite}
.pp .ppal svg{width:100%;height:100%;display:block;transform-origin:50% 85%}
.pp .ppal svg.peek{animation:palpeek .7s ease-out 1}
@keyframes palpeek{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-14%) scale(1.06) rotate(var(--gl,0deg))}65%{transform:translateY(-4%) rotate(calc(var(--gl,0deg)*.5))}}
.pp .ppal svg.glance{animation:palglance .8s ease-in-out 1}
@keyframes palglance{0%,100%{transform:rotate(0)}30%,60%{transform:rotate(var(--gl,0deg))}}
.pp .ppal svg.happy{animation:palhappy 1.8s ease-in-out 1}
@keyframes palhappy{0%,100%{transform:rotate(0) scale(1)}12%{transform:rotate(-14deg) translateY(-8%) scale(1.12)}27%{transform:rotate(14deg) translateY(-8%) scale(1.12)}42%{transform:rotate(-10deg) scale(1.06)}57%{transform:rotate(10deg) scale(1.06)}72%{transform:rotate(-4deg)}86%{transform:rotate(3deg)}}
.pp .ptxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pp h3{font-size:14px;color:var(--foam);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .rmeter{height:8px}
.pp .psub{margin:0;font-size:11.5px;font-weight:800;color:var(--mist);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- tides, helpers, rescue (play view) ---------- */
.hud2{display:flex;align-items:stretch;gap:8px;min-height:46px}
.hud2[hidden]{display:none!important}
.tidem{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);box-shadow:var(--rim);border-radius:16px;padding:5px 10px;transition:background .5s}
.tidem.low{background:linear-gradient(180deg,rgba(150,120,70,.92),rgba(92,74,44,.92))}
.tidem .ti{width:30px;height:30px;flex:none}
.tidem .ti svg{width:100%;height:100%;display:block}
.tidem .tt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.tidem .tt b{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.tidem .tt span{font-size:12px;font-weight:800;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tidem.low .tt span{color:#F4E2BC}
.tidem .tt span em{font-style:normal;color:var(--sand);font-weight:900}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:8px;height:14px;border-radius:4px;background:rgba(255,255,255,.14)}
.pips i.on{background:var(--aqua);box-shadow:0 0 6px rgba(61,220,203,.7)}
.tidem.low .pips i.on{background:var(--sand);box-shadow:0 0 6px rgba(255,217,138,.7)}
.pips i.last{animation:throb .9s ease-in-out infinite}
.nextdir{flex:none;display:flex;flex-direction:column;align-items:center;gap:0;font-size:9px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
.nextdir svg{width:24px;height:24px;display:block;transition:transform .4s}
.tidem.soon{box-shadow:var(--rim),0 0 0 2px var(--sand)}
.helper{position:relative;flex:none;width:58px;border:0;border-radius:16px;padding:0;background:var(--panel);box-shadow:var(--rim);cursor:pointer;display:grid;place-items:center}
.helper .ring{position:absolute;inset:4px;border-radius:50%;background:conic-gradient(var(--aqua) calc(var(--p,0) * 1turn),rgba(255,255,255,.12) 0)}
.helper .ring::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#10364D}
.helper .face{position:relative;width:40px;height:40px}
.helper .face svg{width:100%;height:100%;display:block}
.helper .tag2{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:var(--abyss);color:var(--mist);border-radius:6px;padding:1px 5px;white-space:nowrap}
.helper.ready .ring{background:conic-gradient(var(--sand) 1turn,transparent 0);animation:glowring 1.2s ease-in-out infinite}
.helper.ready .tag2{background:var(--sand);color:var(--ink)}
.helper.aim{box-shadow:var(--rim),0 0 0 3px var(--sand)}
@keyframes glowring{50%{box-shadow:0 0 16px 3px rgba(255,217,138,.8)}}
.board.aim .tile .tl{animation:aimpulse 1.2s ease-in-out infinite}
@keyframes aimpulse{50%{transform:scale(.92)}}
/* low tide: the water drains, the pool floor shows through */
.board.low .slot{background:radial-gradient(circle at 50% 42%,#9C8656 0 40%,#7C6A44 72%)}
.board.low .slot.alt{background:radial-gradient(circle at 50% 42%,#927D50 0 40%,#73623E 72%)}
.slot.rock{background:radial-gradient(circle at 50% 45%,#0C3550 0 52%,#082A40 75%);box-shadow:inset 0 0 0 3px #56656D,inset 0 0 0 5px rgba(0,0,0,.25)}
.slot.rock::after{content:'';position:absolute;inset:22% 18%;border-radius:50%;border-top:2px solid rgba(190,240,255,.35);border-bottom:2px solid rgba(190,240,255,.18)}
.board.low .slot.rock{background:radial-gradient(circle at 50% 42%,#3E7E86 0 40%,#2D5F68 72%)}
.board.low .slot.rock::after{display:none}
.board.tidal .tile{transition:transform .62s cubic-bezier(.55,0,.25,1.12)}
.sweep{position:absolute;inset:0;pointer-events:none;border-radius:16px;overflow:hidden}
.sweep i{position:absolute;inset:0;background:linear-gradient(var(--sa),rgba(61,170,220,0) 0%,rgba(61,170,220,.55) 30%,rgba(220,255,250,.95) 46%,#fff 50%,rgba(61,170,220,.4) 56%,rgba(61,170,220,0) 100%);animation:sweep .9s cubic-bezier(.45,0,.3,1) forwards}
.sweep.low i{background:linear-gradient(var(--sa),rgba(255,217,138,0) 0%,rgba(61,170,220,.6) 34%,rgba(220,255,250,.95) 48%,#fff 50%,rgba(232,201,133,.5) 58%,rgba(232,201,133,0) 100%)}
@keyframes sweep{from{transform:translate(var(--sx0),var(--sy0))}to{transform:translate(var(--sx1),var(--sy1))}}
.tidebanner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--display);font-size:clamp(28px,9cqw,44px);color:#fff;white-space:nowrap;text-shadow:0 3px 0 var(--ink),0 0 24px rgba(61,220,203,.9);animation:banner 1.3s ease-out forwards;display:flex;align-items:center;gap:8px}
.tidebanner.low{text-shadow:0 3px 0 #4A3A1E,0 0 24px rgba(255,217,138,.9)}
.tidebanner svg{width:1em;height:1em}
@keyframes banner{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}15%{transform:translate(-50%,-50%) scale(1.08);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
.washout{position:absolute;width:calc(100% / 7);height:calc(100% / 8);pointer-events:none;animation:washout .7s ease-in forwards}
.washout svg{width:100%;height:100%;display:block}
@keyframes washout{to{transform:translate(var(--wx),var(--wy)) scale(.4) rotate(40deg);opacity:0}}
.exitmark{position:absolute;pointer-events:none;display:flex;align-items:center;justify-content:space-around;color:#BFF7EE;background:linear-gradient(var(--ed),rgba(61,220,203,.55),rgba(61,220,203,0));border-radius:8px}
.exitmark span{display:block;width:14px;height:14px;max-width:100%;animation:nudge 1.4s ease-in-out infinite} /* the svg keeps its own rotation */
.exitmark svg{width:100%;height:100%;display:block}
@keyframes nudge{50%{transform:translate(var(--nx),var(--ny))}}
.lost .tl{animation:bobble 2.2s ease-in-out infinite}
@keyframes bobble{50%{transform:translateY(-6%) rotate(-4deg)}}
.swimmer{position:absolute;width:calc(100% / 7);height:calc(100% / 8);pointer-events:none;animation:swimoff 1.1s cubic-bezier(.4,0,.6,1) forwards}
.swimmer svg{width:100%;height:100%;display:block;animation:paddle .25s ease-in-out infinite alternate}
@keyframes swimoff{20%{transform:scale(1.25)}100%{transform:translate(var(--wx),var(--wy)) scale(1);opacity:0}}
@keyframes paddle{to{transform:rotate(8deg)}}
.tile.lit .tl{animation:litglow 1s ease-in-out infinite}
@keyframes litglow{50%{transform:scale(1.1);filter:drop-shadow(0 0 8px #FFF6A8)}}
.helperfx{position:absolute;left:50%;top:50%;width:46%;transform:translate(-50%,-50%);pointer-events:none;animation:helperin .8s cubic-bezier(.3,1.4,.6,1) forwards}
.helperfx svg{width:100%;display:block;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
@keyframes helperin{0%{transform:translate(-50%,10%) scale(.3);opacity:0}35%{transform:translate(-50%,-50%) scale(1.05);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-80%) scale(.9);opacity:0}}
.tile.inked .tl{animation:spawn .4s cubic-bezier(.34,1.7,.6,1)}
.helpers{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.hpick{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;border-radius:14px;padding:6px 4px;background:var(--abyss);cursor:pointer;font-weight:900;font-size:12px;text-align:center}
.hpick .hp{width:44px;height:44px}
.hpick .hp svg{width:100%;height:100%}
.hpick small{font-size:10px;color:var(--mist);font-weight:800;line-height:1.1}
.hpick[aria-pressed="true"]{border-color:var(--aqua);background:rgba(61,220,203,.14)}
.hpick .paid{font-size:9px;color:var(--coral);font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.mech{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:800;color:var(--foam);background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}
.mech svg{width:22px;height:22px;flex:none}
.boostnote{font-size:12px;font-weight:900;color:var(--coral)}

/* ---------- tabs ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:4px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 0;border-radius:14px;font-weight:800;font-size:12px;color:var(--mist);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{background:var(--panel);box-shadow:var(--rim);color:var(--sand)}
.badge{position:absolute;top:2px;right:calc(50% - 26px);background:var(--coral);color:var(--foam);font-size:10px;font-weight:900;border-radius:9px;padding:1px 6px}

/* ---------- shared bits ---------- */
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;text-wrap:balance;letter-spacing:.3px}
h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0;color:var(--sand)}
.muted{color:var(--mist);font-size:14px;margin:0}
.fine{font-size:11px;color:var(--mist);margin:0}
.btn{border:0;border-radius:15px;padding:12px 16px;font-weight:900;font-size:15px;cursor:pointer;background:linear-gradient(180deg,#7CF3E5,var(--aqua) 55%,#25B5A6);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 0 #157A70,0 8px 14px rgba(0,0,0,.25);white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 0 #157A70}
.btn.buy{background:linear-gradient(180deg,#FFF0C4,var(--sand) 55%,#F0B856);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 0 #A8742A,0 8px 14px rgba(0,0,0,.25)}
.btn.ghost{background:var(--surf);color:var(--foam);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 0 #0B2A3D}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--panel);box-shadow:var(--rim);border-radius:20px;padding:12px}
.rar{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:1px 6px;background:var(--abyss);color:var(--mist)}
.rar.rare{color:var(--aqua)} .rar.epic{color:var(--sand)}
.tag{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--sand);border-radius:6px;padding:1px 6px;margin-bottom:3px}
.cur-sd{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.cur-sd svg{width:18px;height:18px}

/* ---------- reef map (one card per pool; the current pool opens to show its 10 levels) ---------- */
.maphead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kind{margin:0;font-weight:800;font-size:13px;color:var(--sand);letter-spacing:.02em}
.welcome{display:flex;flex-direction:column;gap:6px;background:rgba(255,217,138,.1);border:1.5px solid rgba(255,217,138,.4);border-radius:18px;padding:12px 14px;font-weight:700;font-size:14px;line-height:1.4;flex:none}
.welcome b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--sand)}
.reef{display:flex;flex-direction:column;gap:12px;flex:none}
.rpool{background:var(--panel);box-shadow:var(--rim);border-radius:22px;overflow:hidden;flex:none}
.rpool.cur{box-shadow:var(--rim),0 0 0 2.5px rgba(61,220,203,.55)}
.rhead{display:block;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.rhead[disabled]{cursor:default}
.rscene{position:relative;height:118px;overflow:hidden;background:#2C3836}
.rscene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rscene.big{height:170px;border-radius:18px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);flex:none}
.rstage{position:absolute;left:10px;top:10px;font-size:10.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;background:rgba(10,32,51,.72);color:var(--foam);border-radius:999px;padding:3px 9px}
.rpool.s3 .rstage{background:var(--aqua);color:var(--ink)}
.rlock{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;font-weight:900;font-size:14px;color:var(--foam);background:rgba(10,32,51,.45)}
.rmeta{display:flex;flex-direction:column;gap:6px;padding:10px 14px 12px}
.rname{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rname h3{color:var(--foam);font-size:20px;min-width:0;overflow-wrap:anywhere}
.rstars{flex:none;font-weight:900;font-size:14px;color:var(--sand);font-variant-numeric:tabular-nums}
.rmeter{position:relative;height:12px;border-radius:999px;background:var(--abyss);box-shadow:inset 0 2px 3px rgba(0,0,0,.35);overflow:hidden}
.rmeter i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#25B5A6,var(--aqua) 60%,#9CF7EC);transition:width .6s cubic-bezier(.2,.8,.3,1)}
.rmeter b{position:absolute;top:2px;bottom:2px;width:2px;margin-left:-1px;background:rgba(234,248,245,.35);border-radius:1px}
.rsub{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 8px;font-size:12.5px;font-weight:800;color:var(--mist)}
.rcont{display:flex;padding:0 12px 10px}
.rcont .btn{flex:1}
.rlevels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:2px 12px 14px}
.lvl{position:relative;width:100%;aspect-ratio:1;max-height:62px;border:0;border-radius:16px;padding:0 0 9px;font-family:var(--display);font-size:20px;color:var(--ink);cursor:pointer;background:radial-gradient(circle at 36% 28%,#FFF6D6 0 12%,#FFD98A 50%,#D9973A);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 4px 0 #8A5A1E;display:grid;place-items:center}
.lvl:active{transform:translateY(2px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 2px 0 #8A5A1E}
.lvl.cur{background:radial-gradient(circle at 36% 28%,#E6FFFB 0 12%,#3DDCCB 50%,#168C83);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 4px 0 #0D5E57,0 0 0 4px rgba(61,220,203,.28);animation:pulse 1.8s ease-in-out infinite}
.lvl.lock{background:var(--abyss);color:#3C7A96;box-shadow:inset 0 2px 4px rgba(0,0,0,.4);cursor:default}
.lvl .ls{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center}
.lvl .ls svg{width:13px;height:13px}
@keyframes pulse{50%{transform:scale(1.06)}}
.rs-sway{transform-box:fill-box;transform-origin:50% 100%;animation:kelp 4s ease-in-out infinite alternate}
.rs-sway.b{animation-duration:5.2s;animation-delay:-2s}
.rs-fish{transform-box:fill-box;transform-origin:50% 50%;animation:fishx var(--fd,9s) linear infinite}
@keyframes fishx{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(var(--fx,120px)) scaleX(1)}50%{transform:translateX(var(--fx,120px)) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.rs-rays{animation:raypulse 6s ease-in-out infinite alternate}
@keyframes raypulse{from{opacity:.55}to{opacity:1}}
.rs-bub{animation:rsbub 4s ease-in infinite}
@keyframes rsbub{to{transform:translateY(-120px);opacity:0}}
/* stage-up celebration: the old stage washes away to reveal the new one */
.cele{display:flex;flex-direction:column;gap:12px}
.cfwrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit}
.rscene .from{position:absolute;inset:0}
.rscene .from>svg{width:100%;height:100%;display:block}
.cele .rscene .from{animation:washout 1.6s .35s ease-in-out forwards}
@keyframes washout{to{opacity:0;transform:scale(1.04)}}
.cele h2{color:var(--sand)}
.dyk{text-align:left;background:rgba(61,220,203,.1);border:1.5px solid rgba(61,220,203,.4);border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:700;line-height:1.4}
.dyk .label{color:var(--aqua);margin-bottom:2px}
.gift{display:flex;align-items:center;gap:10px;text-align:left;background:var(--abyss);border-radius:14px;padding:8px 10px;font-weight:800;font-size:14px}
.gift .art{width:46px;height:46px;flex:none;display:grid;place-items:center}
.gift .art svg{width:100%;height:100%;overflow:visible}
.movers{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.movers span{width:52px}
.movers svg{width:100%;display:block}
@media (prefers-reduced-motion:reduce){.cele .rscene .from{display:none}}

/* ---------- home pool extras: reef scenery, residents, photo mode ---------- */
.poolhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.btn.cam{display:inline-flex;align-items:center;gap:6px;flex:none}
.btn.cam svg{width:18px;height:18px}
.scen{position:absolute;pointer-events:none}
.scen svg{width:100%;height:100%;display:block;overflow:visible}
.scen.sway svg{transform-origin:50% 100%;animation:kelp 5s ease-in-out infinite alternate}
.homes{display:flex;flex-direction:column;gap:10px}
.home{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.home .hn{font-weight:900;font-size:14px;min-width:0;flex:1 1 120px}
.home .hn small{display:block;font-weight:800;font-size:12px;color:var(--mist)}
.home .hp{display:flex;gap:2px;flex-wrap:wrap}
.home .hp span{width:34px}
.home .hp svg{width:100%;display:block}
body.photo .top,body.photo .tabs,body.photo #view-pool>:not(.pool){display:none!important}
body.photo #view-pool .pool{height:calc(100% - 76px);min-height:300px}
.photobar{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;gap:8px;width:calc(100% - 32px);max-width:420px}
.photobar .btn{flex:1}
.flexcard{width:100%;border-radius:14px;display:block;box-shadow:0 10px 30px rgba(0,0,0,.45);-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}

/* ---------- field notes ---------- */
button.card{font:inherit;color:inherit;cursor:pointer}
button.card:active{transform:scale(.97)}
.fnhead{display:flex;align-items:center;gap:12px;text-align:left}
.fnhead .art{width:96px;flex:none}
.fnhead .art svg{width:100%;display:block}
.fnanimal{font-family:var(--display);font-size:22px;color:var(--sand);line-height:1.1}
.fnlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.fnlist li{position:relative;padding:10px 12px 10px 34px;background:var(--abyss);border-radius:14px;font-weight:700;font-size:14.5px;line-height:1.4}
.fnlist li::before{content:'';position:absolute;left:12px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--aqua);box-shadow:0 0 0 3px rgba(61,220,203,.25)}

/* ---------- pool ---------- */
.pool{position:relative;flex:none;height:min(56vh,420px);border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#3AA6C4 0%,#1C6F93 40%,#114A68 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.12),0 10px 26px rgba(0,0,0,.35)}
.pool .prays{position:absolute;inset:-10% -30% 30%;background:repeating-linear-gradient(100deg,rgba(255,255,255,.12) 0 4%,transparent 4% 12%);-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);animation:sway 10s ease-in-out infinite alternate}
.pool .floor{position:absolute;left:-2%;right:-2%;bottom:0;height:24%}
.pool .floor svg{width:100%;height:100%;display:block}
.deco{position:absolute;pointer-events:none}
.deco svg{width:100%;height:100%;display:block;overflow:visible}
.deco.sway svg{transform-origin:50% 100%;animation:kelp 4s ease-in-out infinite alternate}
@keyframes kelp{from{transform:skewX(-6deg)}to{transform:skewX(6deg)}}
.swim{position:absolute;width:20%;max-width:96px;border:0;background:none;padding:0;cursor:pointer;animation:swimx var(--d) linear infinite;animation-delay:var(--dl)}
.swim .bob{display:block;animation:bob 3.2s ease-in-out infinite;animation-delay:var(--dl)}
.swim svg{width:100%;display:block;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.swim.spin .bob{animation:twirl .6s ease-in-out}
@keyframes swimx{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(var(--dist)) scaleX(1)}50%{transform:translateX(var(--dist)) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
@keyframes bob{50%{transform:translateY(-9px) rotate(3deg)}}
@keyframes twirl{50%{transform:scale(1.2) rotate(180deg)}100%{transform:rotate(360deg)}}
.pbub{position:absolute;bottom:20%;width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);animation:pbub 5s ease-in infinite}
@keyframes pbub{to{transform:translateY(-300px);opacity:0}}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--foam);font-weight:800}

/* ---------- album / shop rows ---------- */
.set{display:flex;flex-direction:column;gap:10px}
.sethead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card{position:relative;background:linear-gradient(180deg,#1F607E,#174C66);border-radius:14px;padding:6px 4px 8px;text-align:center;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.card svg{width:100%;height:auto;display:block}
.card .nm{font-weight:900;font-size:12px}
.card[data-r="rare"]{border-color:var(--aqua)}
.card[data-r="epic"]{border-color:var(--sand)}
.card.locked{border-color:transparent;background:var(--abyss)}
.card.locked .nm{color:var(--mist)}
.card .trade{margin-top:3px;border:0;border-radius:9px;padding:4px 6px;font-weight:900;font-size:11px;background:var(--surf);color:var(--foam);cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.card .trade svg{width:13px;height:13px}
.card .trade.can{background:var(--sand);color:var(--ink)}
.cnt{position:absolute;top:4px;right:6px;font-size:11px;font-weight:900;color:var(--sand)}
.offer{display:flex;align-items:center;gap:12px}
.offer .art{width:56px;height:56px;flex:none}
.offer .art svg{width:100%;height:100%}
.offer .txt{flex:1;min-width:0}
.offer .t{font-weight:900;font-size:16px}
.offer.hero{background:linear-gradient(135deg,#2A7FA3,#10364D);box-shadow:inset 0 0 0 2px var(--sand),0 8px 20px rgba(0,0,0,.3)}
.decos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.decocard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px}
.decocard .art{width:64px;height:64px}
.decocard .art svg{width:100%;height:100%;overflow:visible}
.decocard .t{font-weight:900;font-size:14px}

/* ---------- modal & sheets ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,12,22,.72);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.mcard{position:relative;width:100%;max-width:350px;max-height:calc(100% - 8px);overflow-y:auto;background:linear-gradient(180deg,#1F607E,#10364D 55%);border-radius:26px;padding:22px 18px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 2px rgba(255,255,255,.08),0 24px 60px rgba(0,0,0,.55);animation:modalin .34s cubic-bezier(.34,1.5,.64,1)}
.modal.sheet{place-items:end center;padding-bottom:0}
.modal.sheet .mcard{max-width:520px;border-radius:26px 26px 0 0;padding-bottom:max(18px,env(safe-area-inset-bottom,0px));text-align:left;animation:sheetin .32s cubic-bezier(.2,.9,.3,1)}
@keyframes modalin{from{transform:scale(.8);opacity:0}}
@keyframes sheetin{from{transform:translateY(100%)}}
.mcard .row{display:flex;flex-direction:column;gap:8px}
.mcard .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stars{display:flex;justify-content:center;gap:6px}
.stars svg{width:54px;height:54px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.stars svg:nth-child(2){transform:translateY(-12px)}
.stars .on{animation:starin .45s cubic-bezier(.34,1.8,.6,1) backwards}
.stars .on:nth-child(1){animation-delay:.15s}.stars .on:nth-child(2){animation-delay:.35s}.stars .on:nth-child(3){animation-delay:.55s}
@keyframes starin{from{transform:scale(0) rotate(-60deg)}}
.cf{position:absolute;top:30%;left:50%;width:8px;height:12px;border-radius:2px;pointer-events:none;animation:cf 1.2s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.shellbtn{background:none;border:0;cursor:pointer;width:140px;margin:0 auto;padding:0;animation:wobble 1.4s ease-in-out infinite}
.shellbtn svg{width:100%;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.shellbtn.crack{animation:crack .55s ease-in forwards}
.shellart{width:96px;margin:0 auto;animation:wobble 1.6s ease-in-out infinite}
.shellart svg{width:100%;display:block}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(0)}}
@keyframes crack{30%{transform:scale(1.1) rotate(-8deg)}60%{transform:scale(1.15) rotate(8deg)}100%{transform:scale(1.6);opacity:0}}
.reveal{width:170px;margin:0 auto;animation:revealin .5s cubic-bezier(.34,1.6,.64,1)}
.reveal svg{width:100%;display:block}
@keyframes revealin{from{transform:scale(0) rotate(-20deg)}}
.newtag{font-family:var(--display);color:var(--coral);font-size:20px}
.ggrid{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.ggrid .g{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900}
.ggrid .g .gi{width:42px;height:42px}
.ggrid .g .gi svg{width:100%;height:100%;overflow:visible}
.intro{display:flex;gap:10px;align-items:flex-start;background:rgba(255,217,138,.12);border:1.5px solid rgba(255,217,138,.45);border-radius:14px;padding:10px;font-weight:800;font-size:14px}
.intro b{font-family:var(--display);font-weight:400;color:var(--sand)}
.boosts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.boost{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent;border-radius:14px;padding:8px 4px;background:var(--abyss);cursor:pointer;font-weight:900;font-size:12px;text-align:center}
.boost .bi{width:34px;height:34px}
.boost .bi svg{width:100%;height:100%;overflow:visible}
.boost .bp{display:flex;align-items:center;gap:2px;color:var(--mist);font-size:12px}
.boost .bp svg{width:14px;height:14px}
.boost[aria-pressed="true"]{border-color:var(--sand);background:rgba(255,217,138,.14)}
.boost[disabled]{opacity:.4;cursor:not-allowed}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.close{border:0;background:var(--surf);border-radius:12px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:800}
.switch{position:relative;width:54px;height:32px;border-radius:999px;border:0;background:var(--abyss);cursor:pointer;flex:none;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.switch::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--mist);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:#1A8C80}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--foam)}
.danger{color:var(--coral)}
.linkbtn{background:none;border:0;color:var(--coral);font-weight:900;font-size:14px;text-decoration:underline;cursor:pointer;padding:8px 0}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--foam);color:var(--ink);font-weight:800;font-size:14px;border-radius:999px;padding:9px 16px;box-shadow:0 8px 20px rgba(0,0,0,.4);max-width:calc(100% - 40px);text-align:center;animation:toastin .25s ease-out}
@keyframes toastin{from{transform:translate(-50%,20px);opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.bub,.caustic{display:none}}
</style>

<script type="module">
// iOS Safari pinch-zoom guard (gesturestart ignores touch-action)
document.addEventListener('gesturestart', (e) => e.preventDefault());
import { createStudio, resolveEndpoint } from '../sdk/studio-sdk.js';
import { ABILITIES, GRAVITY, activeMask, applyAbility, bestSwap, buildBoard, collapse, counter, doubleCounts, ensureBubbles, extraMovesCanWin, goalStatus, goalsMet,
  hasMoves, helperCharge, isFixed, maskOf, mulberry32, newProgress, addProgress, rescueLost, resolveMatches, resolveSwap, rockOf,
  shuffle, starsFor, tidePhase, tideTurns, turnTide, COLS, ROWS } from './board.js';
import { HELPER_LEVEL, levelDef, levelFromSearch, withoutTides } from './levels.js';
import { BOOSTERS, DECOR, addPal, bankShell, buyBoosters, useBooster, buyDecor, buyPalWithSandDollars, loadSave, palEarned, pickHelper,
  recordWin, resetProgress, sandDollarCost, shellDrop, takeShell, writeSave } from './save.js';
import { FIELD_NOTES, PAL_HOME, POOL_SIZE, STAGES, claimThriving, continueAt, didYouKnow, homeScenery, initReef, pendingThriving,
  poolInfo, poolOf, poolProgress, reefPools, residents, takeStageUps } from './reef.js';

const studio = createStudio({ game: 'tidepool-pals', version: '0.12.1', endpoint: resolveEndpoint(location, window.STUDIO_CONFIG ?? { endpoint: '' }) });
/** Game-specific events ride on the SDK's 'custom' event (the ingest accepts a fixed list of names). */
const ev = (event, props = {}) => studio.track('custom', { event, ...props });
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const motion = () => !RM.matches;
/** Tides feature flag (default on). The SDK assigns the variant and tracks exposure once. Only 'on' is served
    today; adding 'off' to the list turns this into an A/B test. ?tides=off forces it off for local QA. */
const TIDE_VARIANTS = ['on'];
const TIDES = new URLSearchParams(location.search).get('tides') === 'off' ? 'off' : studio.flag('tides', TIDE_VARIANTS);
const TIDES_ON = TIDES !== 'off';
const playDef = (n) => (TIDES_ON ? levelDef(n) : withoutTides(levelDef(n)));

/* ---------- art: tiles share gradients defined once ---------- */
const TC = [ // base, light, dark
  ['#FF6F61', '#FFC4BA', '#B8343A'], ['#FFC93C', '#FFF4B8', '#C47812'], ['#3DDCCB', '#C6FFF7', '#0D8790'],
  ['#A77BFF', '#E9DCFF', '#5A33C2'], ['#7BD45A', '#DCFFC4', '#378824']];
const TILE_NAME = ['Coral', 'Sunstar', 'Droplet', 'Sea Candy', 'Kelp'];
document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
${TC.map(([b, l, d], i) => `<radialGradient id="tg${i}" cx="36%" cy="28%" r="82%"><stop offset="0" stop-color="${l}"/><stop offset=".42" stop-color="${b}"/><stop offset="1" stop-color="${d}"/></radialGradient>`).join('')}
<radialGradient id="tspec"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".6" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="tsh"><stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="tsand" cx="38%" cy="26%" r="90%"><stop offset="0" stop-color="#FFF2CF"/><stop offset=".5" stop-color="#E8C27A"/><stop offset="1" stop-color="#A97A34"/></radialGradient>
<linearGradient id="tice" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2FDFF" stop-opacity=".9"/><stop offset=".45" stop-color="#A8E8F7" stop-opacity=".42"/><stop offset="1" stop-color="#5CC3E0" stop-opacity=".75"/></linearGradient>
<radialGradient id="turch" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="#C8A6FF"/><stop offset=".5" stop-color="#6B43A6"/><stop offset="1" stop-color="#2E1752"/></radialGradient>
<radialGradient id="twave" cx="36%" cy="28%" r="82%"><stop offset="0" stop-color="#D6FBFF"/><stop offset=".45" stop-color="#36A9E0"/><stop offset="1" stop-color="#0E4F8A"/></radialGradient>
<radialGradient id="tpearl" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#EDE6FF"/><stop offset="1" stop-color="#B9A8E8"/></radialGradient>
</defs></svg>`);

function starPts(cx, cy, R, r) { const p = []; for (let i = 0; i < 10; i++) { const a = (-90 + 36 * i) * Math.PI / 180, rr = i % 2 ? r : R; p.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1)); } return p.join(' '); }
// Cartoon pals, drawn in code: 0 crab, 1 starfish, 2 fish, 3 octopus, 4 turtle. Each keeps its colour.
// Each entry: parts drawn behind the body (fins, claws, flippers), the body, and parts in front (shell marks).
const SHAPES = [
  { back: (a) => `<circle cx="6.5" cy="12" r="4.6" ${a}/><circle cx="33.5" cy="12" r="4.6" ${a}/><path d="M4 7l3 3.2M36 7l-3 3.2" stroke="#fff" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/>`,
    body: (a) => `<ellipse cx="20" cy="22" rx="15.5" ry="13.5" ${a}/>` },
  { back: () => '',
    body: (a) => `<polygon points="${starPts(20, 21.5, 16, 9.5)}" stroke-linejoin="round" ${a}/>` },
  { back: (a) => `<path d="M28 21L38 11Q39.5 21 38 31Z" stroke-linejoin="round" ${a}/><path d="M14 10Q20 2.5 25 9Z" stroke-linejoin="round" ${a}/>`,
    body: (a) => `<ellipse cx="18" cy="21" rx="14.5" ry="12.5" ${a}/>` },
  { back: () => '', // Sea Candy: a frosted sea-glass pebble, drawn in code
    body: () => `<path d="M20 5.5C29.5 4.5 36 11 35.5 20.5 35 30 28.5 35 19.5 34.5 10.5 34 4.5 28.5 5 19.5 5.5 11 11 6 20 5.5Z" fill="url(#tg3)" fill-opacity=".86" stroke="#5A33C2" stroke-opacity=".7" stroke-width="1.6" stroke-linejoin="round"/><path d="M11 27.5Q20 33.5 30 26" fill="none" stroke="#E9DCFF" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round"/><path d="M9 14Q13 8 21 7.2M26 8.4Q31.5 10.5 33 16" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.5" stroke-linecap="round"/><path d="M31.2 24.2l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#fff" fill-opacity=".9"/>` },
  { back: (a) => [[6, 9], [34, 9], [6, 30], [34, 30]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="4.6" ry="3.6" ${a}/>`).join(''),
    body: (a) => `<rect x="6" y="5" width="28" height="29" rx="12" ${a}/>`,
    front: '<path d="M13 31q7-5 14 0M20 27.5v4.5" fill="none" stroke="#378824" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>' }];
const FACE = [[20, 21], [20, 23], [16.5, 21], [20, 19], [20, 17]]; // eye-centre x, y per pal
const SPEC = [[13, 14], [14.5, 14], [11.5, 14.5], [13.5, 10], [13, 10]];
const face = (cx, y) => {
  const L = cx - 5.4, R = cx + 5.4;
  const eye = (x) => `<circle cx="${x}" cy="${y}" r="3.9" fill="#fff" stroke="#14202B" stroke-width=".7"/><circle cx="${x + .3}" cy="${y + .4}" r="2.6" fill="#14202B"/><circle cx="${x + 1.2}" cy="${y - .7}" r="1.1" fill="#fff"/><circle cx="${x - .7}" cy="${y + 1.3}" r=".55" fill="#fff"/>`;
  return `<ellipse cx="${L - 2.6}" cy="${y + 4.6}" rx="2.4" ry="1.5" fill="#FF8FA3" opacity=".6"/><ellipse cx="${R + 2.6}" cy="${y + 4.6}" rx="2.4" ry="1.5" fill="#FF8FA3" opacity=".6"/>${eye(L)}${eye(R)}<path d="M${cx - 2.6} ${y + 5}q2.6 2.8 5.2 0" fill="none" stroke="#14202B" stroke-width="1.4" stroke-linecap="round"/>`;
};
const SHADOW = '<ellipse cx="20" cy="37" rx="13" ry="3.2" fill="url(#tsh)"/>';
function tileSVG(i) {
  const [sx, sy] = SPEC[i], [fx, fy] = FACE[i], P = SHAPES[i], d = TC[i][2];
  const edge = `stroke="${d}" stroke-width="1.6"`;
  return `<svg viewBox="0 0 40 40">${SHADOW}${P.back(`fill="${TC[i][0]}" ${edge}`)}${P.body(`fill="url(#tg${i})" ${edge}`)}${P.front || ''}<ellipse cx="${sx}" cy="${sy}" rx="5.4" ry="2.9" fill="url(#tspec)" transform="rotate(-28 ${sx} ${sy})"/>${face(fx, fy)}</svg>`;
}
const TILES = TC.map((_, i) => tileSVG(i));
let spikes = ''; for (let i = 0; i < 12; i++) { const a = i * 30 * Math.PI / 180; spikes += `<line x1="${(20 + 9 * Math.cos(a)).toFixed(1)}" y1="${(20 + 9 * Math.sin(a)).toFixed(1)}" x2="${(20 + 18.5 * Math.cos(a)).toFixed(1)}" y2="${(20 + 18.5 * Math.sin(a)).toFixed(1)}"/>`; }
const BOMB = `<svg viewBox="0 0 40 40">${SHADOW}<g stroke="#D9C2FF" stroke-width="3" stroke-linecap="round">${spikes}</g><circle cx="20" cy="20" r="11.5" fill="url(#turch)" stroke="#2E1752" stroke-width="1.2"/><circle cx="20" cy="20" r="4.6" fill="#FF6F61"/><circle cx="20" cy="20" r="7" fill="#FF6F61" opacity=".3"/><ellipse cx="15.5" cy="14.5" rx="4" ry="2.3" fill="url(#tspec)" transform="rotate(-28 15.5 14.5)"/></svg>`;
const WAVE_GLYPH = `<path d="M9.5 21.5q2.6-3.4 5.2 0t5.3 0 5.3 0 5.2 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M4.5 21.5l4-3.4v6.8zM35.5 21.5l-4-3.4v6.8z" fill="#fff"/>`;

function creatureSVG(cr, locked) {
  const f = locked ? '#24566E' : cr.col;
  let rx = 30, ry = 27, cy = 60;
  if (cr.shape === 'tall') { rx = 24; ry = 32; cy = 58; } else if (cr.shape === 'wide') { rx = 35; ry = 23; cy = 62; }
  const L = 50 - rx, R = 50 + rx, top = cy - ry, bot = cy + ry;
  let back = '', front = '';
  switch (cr.feat) {
    case 'fins':
      back += `<path d="M${L + 6} ${cy} L${L - 12} ${cy - 14} L${L - 8} ${cy + 12}Z" fill="${f}"/><path d="M${R - 6} ${cy} L${R + 12} ${cy - 14} L${R + 8} ${cy + 12}Z" fill="${f}"/>`;
      back += `<path d="M44 ${top + 4} L50 ${top - 12} L56 ${top + 4}Z" fill="${f}"/>`; break;
    case 'claws':
      [[L - 6, -1], [R + 6, 1]].forEach(([x, s]) => { back += `<line x1="${x - 6 * s}" y1="${cy}" x2="${x}" y2="${cy - 12}" stroke="${f}" stroke-width="6" stroke-linecap="round"/><circle cx="${x}" cy="${cy - 18}" r="10" fill="${f}"/><path d="M${x - 4} ${cy - 30} L${x} ${cy - 19} L${x + 4} ${cy - 30}Z" fill="#0A2033" opacity=".55"/>`; }); break;
    case 'spikes': {
      const pts = []; for (let i = 0; i <= 6; i++) { const a = (195 + 25 * i) * Math.PI / 180; const b1 = a - .17, b2 = a + .17;
        pts.push(`M${(50 + rx * .9 * Math.cos(b1)).toFixed(1)} ${(cy + ry * .9 * Math.sin(b1)).toFixed(1)} L${(50 + (rx + 13) * Math.cos(a)).toFixed(1)} ${(cy + (ry + 13) * Math.sin(a)).toFixed(1)} L${(50 + rx * .9 * Math.cos(b2)).toFixed(1)} ${(cy + ry * .9 * Math.sin(b2)).toFixed(1)}Z`); }
      back += `<path d="${pts.join(' ')}" fill="${f}"/>`; break; }
    case 'tentacles':
      [-18, -6, 6, 18].forEach((dx, i) => { const x = 50 + dx * (rx / 30); back += `<path d="M${x} ${bot - 8} q ${i % 2 ? 6 : -6} 10 0 18 q ${i % 2 ? -6 : 6} 8 0 14" fill="none" stroke="${f}" stroke-width="6" stroke-linecap="round"/>`; }); break;
    case 'lure':
      back += `<path d="M50 ${top + 2} Q 50 ${top - 20} 70 ${top - 16}" fill="none" stroke="${f}" stroke-width="3.5" stroke-linecap="round"/>`;
      front += locked ? `<circle cx="71" cy="${top - 16}" r="6" fill="${f}"/>` : `<circle cx="71" cy="${top - 16}" r="11" fill="#FFF6A8" opacity=".25"/><circle cx="71" cy="${top - 16}" r="6" fill="#FFF6A8"/>`; break;
    case 'crown':
      [[38, -4], [50, -9], [62, -4]].forEach(([x, dy]) => { back += `<line x1="${x}" y1="${top + 6}" x2="${x}" y2="${top + dy}" stroke="${f}" stroke-width="5" stroke-linecap="round"/>`; front += `<circle cx="${x}" cy="${top + dy - 4}" r="5" fill="${locked ? f : '#FFD98A'}"/>`; }); break;
    case 'shell':
      front += `<path d="M${L + 2} ${cy - 2} A${rx - 2} ${ry - 2} 0 0 1 ${R - 2} ${cy - 2} Z" fill="${locked ? '#2B6580' : '#C9763A'}" opacity="${locked ? .6 : 1}"/>`;
      if (!locked) for (let i = 1; i < 4; i++) { const x = L + 2 + (rx * 2 - 4) * i / 4; front += `<line x1="50" y1="${cy - 2}" x2="${x.toFixed(1)}" y2="${(cy - 2 - Math.sqrt(Math.max(0, 1 - ((x - 50) / (rx - 2)) ** 2)) * (ry - 2)).toFixed(1)}" stroke="#A85E2C" stroke-width="2.5"/>`; }
      break;
  }
  let body = `<ellipse cx="50" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}"/>`;
  let face = '';
  if (locked) { face = `<text x="50" y="${cy + 9}" text-anchor="middle" font-family="Bagel Fat One, sans-serif" font-size="28" fill="#3C7A96">?</text>`; }
  else {
    body += `<ellipse cx="50" cy="${cy + ry * .45}" rx="${rx * .7}" ry="${ry * .45}" fill="#000" opacity=".1"/><ellipse cx="50" cy="${cy + ry * .4}" rx="${rx * .62}" ry="${ry * .42}" fill="#fff" opacity=".18"/><ellipse cx="${50 - rx * .45}" cy="${cy - ry * .55}" rx="7" ry="4" fill="#fff" opacity=".45" transform="rotate(-25 ${50 - rx * .45} ${cy - ry * .55})"/>`;

    face += `<path d="M45 ${ey + 9} Q50 ${ey + 14} 55 ${ey + 9}" fill="none" stroke="#14202B" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${locked ? 'Undiscovered creature' : cr.name}">${back}${body}${front}${face}</svg>`;
}

function check() {

  if (lvl.snap) { goalStatus(lvl.def, lvl.prog).forEach((g, i) => { lvl.best[i] = Math.max(lvl.best[i], g.got - lvl.snap[i]); }); lvl.snap = null; }
  if (goalsMet(lvl.def, lvl.prog)) { lvl.over = true; setTimeout(win, 380); return; }
  if (lvl.moves <= 0) { outOfMoves(); return; }
  if (!hasMoves(grid)) { shuffle(grid, rng, lvl.def.colors, newId); render(); toast('No matches left, so the tide reshuffled the pool'); }
  armIdle();
}

/* ---------- effects ---------- */
const cx = (c) => ((c + .5) / COLS * 100) + '%', cy = (r) => ((r + .5) / ROWS * 100) + '%';
function fxNode(cls, style, ms) { const d = document.createElement('div'); d.className = cls; d.style.cssText = style; fxEl.appendChild(d); setTimeout(() => d.remove(), ms); return d; }
function burst(r, c, color, n) {
  const w = boardEl.clientWidth / COLS;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, d = w * (.5 + Math.random() * .9);
    fxNode('pt', `left:${cx(c)};top:${cy(r)};background:${color};--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d).toFixed(0)}px;width:${(5 + Math.random() * 6).toFixed(0)}px;height:${(5 + Math.random() * 6).toFixed(0)}px`, 600);
  }
}
/** Sea Candy pop: a soft pastel sugar-sparkle burst (little glowing diamonds and dots), all CSS, no assets. */
const SUGAR = ['#FFD9EC', '#D9F3FF', '#E9DCFF', '#FFF3C9', '#D5FFE9'];
function sugarSparkle(r, c) {
  const w = boardEl.clientWidth / COLS;
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2 + Math.random() * .5, d = w * (.45 + Math.random() * .5);
    const col = SUGAR[i % SUGAR.length], star = i % 2 === 0, s = star ? 8 + Math.random() * 3 : 5 + Math.random() * 2;
    fxNode('pt', `left:${cx(c)};top:${cy(r)};background:#fff;box-shadow:0 0 7px 2px ${col};--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d).toFixed(0)}px;width:${s.toFixed(0)}px;height:${s.toFixed(0)}px;border-radius:${star ? '2px' : '50%'};rotate:${star ? '45deg' : '0deg'}`, 600);
  }
}
function fxFor(e) {
  if (!motion()) return;
  const k = e.kind, ef = e.effect;
  if (k === 'combo') fxNode('flash', '', 420);
  if (ef.box) fxNode('ring' + (ef.box > 1 ? ' big' : ''), `left:${cx(e.c)};top:${cy(e.r)}`, 480);
  for (const dr of ef.rows || []) if (e.r + dr >= 0 && e.r + dr < ROWS) fxNode('beam h', `top:${(e.r + dr) / ROWS * 100}%`, 520);
  for (const dc of ef.cols || []) if (e.c + dc >= 0 && e.c + dc < COLS) fxNode('beam v', `left:${(e.c + dc) / COLS * 100}%`, 520);
  for (const col of ef.colors || []) fxNode('swirl', `left:${cx(e.c)};top:${cy(e.r)};--sc:${TC[col][0]}`, 780);
  if (ef.all) fxNode('swirl', `left:50%;top:50%;width:220%;--sc:#fff`, 780);
}
function floatAt(r, c, text) { const s = document.createElement('span'); s.className = 'float'; s.textContent = text; s.style.left = cx(c); s.style.top = cy(r); fxEl.appendChild(s); setTimeout(() => s.remove(), 900); }
function shake(size) { if (!motion()) return; const v = $('view-play'); v.classList.remove('shk-s', 'shk-l'); void v.offsetWidth; v.classList.add('shk-' + size); }

/* ---------- idle hint: after ~6s without a move, the two pals of the best swap wiggle ---------- */
function clearHint() { clearTimeout(idleT); document.querySelectorAll('.tile.hintme').forEach((t) => { t.classList.remove('hintme'); t.style.removeProperty('--hx'); t.style.removeProperty('--hy'); }); fxEl.querySelectorAll('.coach').forEach((x) => x.remove()); }
/** The best swap, preferring a match of a colour a collect goal still needs, so the hint also teaches the goal. */
function hintSwap() {
  const want = new Set(goalStatus(lvl.def, lvl.prog).filter((g) => g.t === 'collect' && !g.done).map((g) => g.c));
  return bestSwap(grid, want);
}
/** Before the first move of the first levels the coach shows up fast, with a "Swipe →" bubble; later only after 6s idle. */
function armIdle() {
  clearHint();
  const teach = !!lvl && lvl.n <= 3 && lvl.made === 0;
  idleT = setTimeout(() => {
    if (!lvl || lvl.over || busy || view !== 'play' || !modal.hidden) return;
    const s = hintSwap();
    if (!s) return;
    if (teach) fxNode('coach', `left:${cx(s.c)};top:${cy(s.r)}`, 60_000).textContent = s.r2 > s.r ? 'Swipe ↓' : 'Swipe →';
    for (const [r, c, dr, dc] of [[s.r, s.c, s.r2 - s.r, s.c2 - s.c], [s.r2, s.c2, s.r - s.r2, s.c - s.c2]]) {
      const el = els.get(grid[r][c].id);
      if (!el) continue;
      el.style.setProperty('--hx', String(dc)); el.style.setProperty('--hy', String(dr));
      el.classList.add('hintme');
    }
  }, teach ? 900 : 5000);
}

/* ---------- parallax tilt (pointer) ---------- */
{
  const wrap = $('boardwrap'); let raf = 0, px = 0, py = 0;
  wrap.addEventListener('pointermove', (e) => {
    if (!motion() || e.pointerType === 'touch') return;
    const b = wrap.getBoundingClientRect(); px = (e.clientX - b.left) / b.width - .5; py = (e.clientY - b.top) / b.height - .5;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; boardEl.style.setProperty('--ry', (px * 6).toFixed(2) + 'deg'); boardEl.style.setProperty('--rx', (7 - py * 6).toFixed(2) + 'deg'); });

/* ---------- HUD ---------- */
let lastGot = [];
function hud(reset = false) {
  $('pearlCount').textContent = S.pearls.toLocaleString();
  const claimable = SETS.some((s, i) => setDone(i) && !S.claimed[i]);
  const bd = $('albumBadge'); bd.hidden = !claimable && S.shells <= 0; bd.textContent = claimable ? '!' : String(S.shells);
  if (!lvl) return;
  const gs = goalStatus(lvl.def, lvl.prog);
  if (reset) lastGot = [];
  $('goals').innerHTML = gs.map((g, i) => `<div class="gchip${g.done ? ' done' : ''}${lastGot[i] !== undefined && lastGot[i] !== g.got ? ' bump' : ''}" aria-label="${goalText(g)}: ${g.done ? 'done' : (g.need - g.got) + ' to go'}"><span class="gi">${goalIcon(g)}</span><b>${g.done ? '✓' : g.need - g.got}</b>${gs.length <= 2 && !g.done ? `<span class="gw">${goalWord(g)}</span>` : ''}</div>`).join('');
  lastGot = gs.map((g) => g.got);
  $('movesCount').textContent = lvl.moves;
  $('movesBox').classList.toggle('low', lvl.moves <= 3);
  hudTideHelper();
  renderTray();
}
/** Second HUD row: the helper (charge ring) and the tide meter (current tide, moves until it turns, next pull). */
function hudTideHelper() {
  const tide = lvl.def.tide, hb = $('helperBtn'), tm = $('tideMeter');
  $('hud2').hidden = !tide && !lvl.helper;
  hb.hidden = !lvl.helper;
  if (lvl.helper) {
    const ab = ABILITIES[lvl.helper], cr = CREATURES.find((x) => x.id === lvl.helper), ready = helperReady();
    if (hb._for !== lvl.helper) { $('helperFace').innerHTML = creatureSVG(cr, false); hb._for = lvl.helper; }
    hb.style.setProperty('--p', (lvl.charge / ab.charge).toFixed(3));
    hb.classList.toggle('ready', ready);
    $('helperTag').textContent = ready ? 'Tap!' : `${lvl.charge}/${ab.charge}`;
    hb.setAttribute('aria-label', `${cr.name}: ${ab.name}. ${ab.desc} ${ready ? 'Ready: tap to use.' : `Charges with ${TILE_NAME[ab.tc]} pals, ${lvl.charge} of ${ab.charge}.`}`);
  }
  tm.hidden = !tide;
  if (!tide) return;
  const tp = tidePhase(tide, lvl.made), low = tp.phase === 'low';
  const nextName = low ? 'High tide' : 'Low tide';
  tm.className = 'tidem' + (low ? ' low' : '') + (tp.left === 1 ? ' soon' : '');
  const pips = Array.from({ length: tp.total }, (_, i) => `<i class="${i < tp.left ? 'on' : ''}${i === tp.left - 1 && tp.left === 1 ? ' last' : ''}"></i>`).join('');
  tm.innerHTML = `<span class="ti">${low ? TIDE_LOW : TIDE_HIGH}</span>
    <div class="tt"><b>${low ? 'Low tide' : 'High tide'} ${ARROW(tp.dir).replace('<svg ', '<svg width="14" height="14" ')}</b><span>${nextName} in <em>${tp.left}</em> move${tp.left > 1 ? 's' : ''}</span></div>
    <div class="pips" aria-hidden="true">${pips}</div>
    <div class="nextdir">${ARROW(tp.nextDir)}next</div>`;
  tm.setAttribute('aria-label', `${low ? 'Low' : 'High'} tide, pieces move ${DIR_WORD[tp.dir]}. ${nextName} in ${tp.left} move${tp.left > 1 ? 's' : ''}, then pieces move ${DIR_WORD[tp.nextDir]}.`);

let lastPearls = S.pearls;
function pearlsChanged() { if (S.pearls !== lastPearls) { bumpEl($('pearlChip')); lastPearls = S.pearls; } hud(); }

/* ---------- win and lose ---------- */
function win() {
  lvl.over = true;
  clearHint();
  const stars = starsFor(lvl.moves, lvl.def.moves);
  const rec = recordWin(S, lvl.n, stars);
  lvl.shellDrop = shellDrop(lvl, rec.prevBest, stars);
  persist(); pearlsChanged(); sfx.win(); buzz([20, 40, 20]); wigglePal();
  studio.track('level_end', { level: lvl.n, result: 'win', score: stars, moves_left: lvl.moves, specials: lvl.specials, assisted: lvl.assisted, ...endProps() });
  const pearlLine = rec.pearls ? `+${rec.pearls} pearls` : 'No new stars this time';
  showModal(`${confetti()}<div class="label">Level ${lvl.n} cleared</div><div class="stars">${[1, 2, 3].map((i) => STAR(i <= stars)).join('')}</div>
    ${!lvl.assisted ? (lvl.shellDrop ? `<h2>Splendid!</h2><button class="shellbtn" data-act="win-shell" aria-label="Open the shell">${SHELL}</button><p class="muted">${pearlLine}, and a shell washed up on the shore. Tap it to open.</p>
    <div class="row2"><button class="btn ghost" data-act="bank-shell">Save for later</button></div>
    <p class="fine">${oddsLine()}</p>`
    : `<h2>${rec.prevBest >= 3 ? 'Still perfect!' : 'Nice run!'}</h2><p class="muted">${pearlLine}. Beat your best star score here to find another shell.</p>
    <div class="row"><button class="btn buy" data-act="next">Next level</button><button class="btn ghost" data-act="map">Map</button></div>`)
    : `<h2>Splendid!</h2><p class="muted">${pearlLine}. Boosted levels don't wash up a shell: shells come from levels cleared without boosters, extra moves or a bought helper.</p>
    <div class="row"><button class="btn buy" data-act="next">Next level</button><button class="btn ghost" data-act="map">Map</button></div>`}`);
}
function outOfMoves() {
  lvl.over = true;
  clearHint(); sfx.lose();
  const done = goalStatus(lvl.def, lvl.prog).reduce((a, g) => a + g.got / g.need, 0) / lvl.def.goals.length;
  studio.track('level_end', { level: lvl.n, result: 'lose', score: Math.round(done * 100), moves_left: 0, specials: lvl.specials, assisted: lvl.assisted, ...endProps() });
  outOfMovesModal();
}
function outOfMovesModal() {
  const left = goalStatus(lvl.def, lvl.prog).filter((g) => !g.done);
  // No dark patterns: +5 moves (sold, or paid in pearls, which are also sold) is offered only when five more moves
  // could still win (extraMovesCanWin). Otherwise the screen says so plainly and offers a fresh try, and no "So close!".
  const canWin = extraMovesCanWin(lvl.def, lvl.prog, lvl.best, 5);
  const close = canWin && left.every((g) => g.need - g.got <= Math.max(2, g.need * .15));
  showModal(`<div class="label">Out of moves</div><h2>${close ? 'So close!' : 'Out of moves'}</h2>
    <div class="ggrid">${left.map((g) => `<div class="g"><span class="gi">${goalIcon(g)}</span>${g.need - g.got} left</div>`).join('')}</div>
    ${canWin ? `<p class="muted">Keep going? Extra moves count as a boost, so this level won't drop a shell.</p>
    <div class="row">
      ${offered(CATALOG.moves) ? `<button class="btn buy" data-act="buy-moves">${CATALOG.moves.title} · ${price(CATALOG.moves)}</button>` : ''}
      <button class="btn" data-act="pearl-moves" ${S.pearls < PEARL_MOVES ? 'disabled' : ''}>+5 moves · ${PEARL_MOVES} pearls</button>
      <button class="btn ghost" data-act="retry">Try again</button>
    </div>` : `<p class="muted">That's more than five extra moves could clear, so a fresh try is your best bet.</p>
    <div class="row"><button class="btn buy" data-act="retry">Try again</button><button class="btn ghost" data-act="map">Map</button></div>`}`);
}
// Extra moves (bought, or paid with pearls, which are also sold) make the level assisted: no shell on that win,
// so no paid path leads to a random reward.
function addMoves() {
  lvl.moves += 5; lvl.over = false; lvl.assisted = true; lvl.shellDrop = false;
  closeModal(); hud(); armIdle();
}
/** Called as the player leaves the win or out-of-moves screens. The SDK decides whether to actually ask. */
function afterLevelScreen() { studio.feedback.maybePrompt(); }

/* ---------- mission card: the level is built on the board, the card says what to do over it ---------- */
let sheetLevel = 1, sheetHelper = null, lastHelper = null;
function openLevel(n) {
  sheetLevel = n;
  // Remember the last helper, but only pre-pick one that was earned: a bought-only pal must be chosen on purpose.
  sheetHelper = n >= HELPER_LEVEL && lastHelper && S.album[lastHelper] && palEarned(S, lastHelper) ? lastHelper : null;
  if (!startLevel(n, [], sheetHelper, { preview: true }) && !startLevel(n, [], null, { preview: true })) return;
  if (!lvl.helper) sheetHelper = null;
  renderMission();
}
/** One line per board mechanic the level uses, so every new idea is explained before play. */
function mechanicsLines(def) {
  const out = [];
  if (def.tide) out.push(`${TIDE_HIGH}<span><b>Tide:</b> high for ${def.tide.high} moves (pals fall down), then low for ${def.tide.low} (pals move ${DIR_WORD[def.tide.dir]}). The meter shows when it turns.</span>`);
  if (def.layout.some((r) => r.includes('o'))) out.push(`${TIDE_LOW}<span><b>Rock pools</b> hold pals at low tide. When the tide rises they wash out and count toward your goals.</span>`);
  if (def.exit) out.push(`${LOST}<span><b>Rescue:</b> get the stranded pal to the open water at the ${EDGE_WORD[def.exit]} edge.</span>`);
  if (levelDef(sheetLevel).tide && !def.tide) out.push(`${TIDE_HIGH}<span>Calm water today: the tide stays high.</span>`);
  return out.map((l) => `<div class="mech">${l}</div>`).join('');
}
function helperPicker(n) {
  if (n < HELPER_LEVEL) return '';
  const owned = CREATURES.filter((c) => S.album[c.id]);
  if (!owned.length) return `<div><div class="label" style="margin-bottom:6px">Helper</div><p class="muted">Pals you find in shells can help from here on. Clear levels to find one.</p></div>`;
  const sel = sheetHelper && ABILITIES[sheetHelper], selCr = sheetHelper && CREATURES.find((c) => c.id === sheetHelper);
  const bought = sheetHelper && !palEarned(S, sheetHelper);
  return `<div><div class="label" style="margin-bottom:6px">Helper (optional)</div>
    <div class="helpers">${owned.map((c) => { const on = c.id === sheetHelper, paid = !palEarned(S, c.id); return `<button class="hpick" data-act="pick-helper" data-id="${c.id}" aria-pressed="${on}"><span class="hp">${creatureSVG(c, false)}</span>${c.name}<small>${ABILITIES[c.id].name}</small>${paid ? '<span class="paid">Boosted</span>' : ''}</button>`; }).join('')}</div>
    ${sel ? `<p class="muted" style="margin-top:4px"><b style="color:var(--sand)">${selCr.name} · ${sel.name}:</b> ${sel.desc} Charges with ${sel.charge} ${TILE_NAME[sel.tc]} pals.</p>` : '<p class="fine">Pick a pal to bring along. It charges as you clear its colour.</p>'}
    ${bought ? `<p class="boostnote">Boosted: no shell this level. ${selCr.name} came from a purchase, so it counts as a boost. Find one in a shell to help for free.</p>` : ''}</div>`;
}
const FINGER = `<svg viewBox="0 0 24 24"><path d="M9 11V4.5a1.5 1.5 0 0 1 3 0V10l5.2 1.1a2 2 0 0 1 1.6 2.2l-.7 5.2A3 3 0 0 1 15.1 21h-3.6a3 3 0 0 1-2.4-1.2L5.4 15a1.6 1.6 0 0 1 2.3-2.2L9 14z" fill="#FFF7E6" stroke="#0A2033" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
function renderMission() {
  const n = sheetLevel, def = lvl.def, best = S.stars[n] || 0;
  const gs = goalStatus(def, newProgress());
  const title = gs.length === 1 ? goalText(gs[0]) : 'Your mission';

    <p class="mmoves">in <b>${def.moves}</b> moves${best ? ` · best ${'★'.repeat(best)}${'☆'.repeat(3 - best)}` : ''}</p>
