<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07030F">
<title>Hyperline</title>
<style>/* Fonts are bundled in ./fonts (SIL OFL 1.1, see fonts/SOURCES.md), so the game makes no outside requests. */
@font-face{font-family:'Monoton';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/Monoton-Regular.ttf) format('truetype');}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/chakra-petch-500-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/chakra-petch-500-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/chakra-petch-600-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/chakra-petch-600-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/chakra-petch-700-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/chakra-petch-700-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}

<style>
/* Layout: one-screen phone game. Brand bar, full-bleed 3D canvas runner in the middle, tab bar at
   the bottom. Deliberately a single dark neon-arcade theme. */
:root{
  --void:#07030F; --night:#120A24; --panel:#1A1033; --edge:#2E1D57;
  --text:#F2ECFF; --dim:#A08FC7; --pink:#FF2BD6; --cyan:#22F0FF; --volt:#FFE45C; --lime:#7CFF6B; --orange:#FF8A3D;
  --display:'Monoton','Impact',system-ui,sans-serif;
  --body:'Chakra Petch',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;touch-action:manipulation}
body{background:var(--void);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
.app{height:100%;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px))}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--volt);outline-offset:2px}

.top{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-size:26px;line-height:1;color:var(--pink);text-shadow:0 0 6px var(--pink),0 0 18px rgba(255,43,214,.6);letter-spacing:1px;margin-right:auto}
.cred{display:flex;align-items:center;gap:6px;border:1px solid var(--edge);background:var(--night);border-radius:8px;padding:5px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.cred i,.dia{display:inline-block;width:10px;height:10px;background:var(--volt);transform:rotate(45deg);box-shadow:0 0 8px var(--volt)}
.dia{width:8px;height:8px;margin-right:4px}
.icon{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--edge);background:var(--night);border-radius:8px;cursor:pointer;padding:0}
.icon svg{width:20px;height:20px}

.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.scroll{overflow-y:auto;padding-bottom:14px;-webkit-overflow-scrolling:touch}
.scroll>*{flex-shrink:0}

/* runner */
.stage{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;border:1px solid var(--edge);touch-action:none;cursor:pointer;background:var(--void)}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-variant-numeric:tabular-nums}
.dist{font-weight:700;font-size:30px;line-height:1;text-shadow:0 0 10px var(--cyan)}
.dist small{font-size:12px;color:var(--dim);display:block;text-shadow:none;letter-spacing:.1em;margin-top:4px}
.dist .sec{color:var(--cyan);opacity:.85}
.hudr{display:flex;align-items:center;gap:8px}
.chips{display:flex;align-items:center;gap:6px;font-weight:700;font-size:18px;color:var(--volt);text-shadow:0 0 8px var(--volt)}
.chips i{width:10px;height:10px;background:var(--volt);transform:rotate(45deg)}
.mult{font-size:12px;color:var(--void);background:var(--volt);border-radius:5px;padding:1px 5px;text-shadow:none;box-shadow:0 0 10px var(--volt)}
.pause{pointer-events:auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--edge);background:rgba(18,10,36,.7);display:grid;place-items:center;cursor:pointer;padding:0}
.pause svg{width:14px;height:14px}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;pointer-events:none;padding:14px}
.ready{justify-content:flex-start;padding-top:96px}
.ready .go{margin-top:8px}
.ready{background:linear-gradient(rgba(7,3,15,.25),rgba(7,3,15,.15) 40%,rgba(7,3,15,.8))}
.go{font-family:var(--display);font-size:clamp(28px,9vw,44px);color:var(--cyan);text-shadow:0 0 8px var(--cyan),0 0 24px rgba(34,240,255,.6);animation:flick 2.4s infinite;line-height:1.1}
.overlay p{margin:0;color:var(--dim);font-weight:600;font-size:14px}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.35}96%{opacity:1}97%{opacity:.5}}
.modes{pointer-events:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(18,10,36,.85);border:1px solid var(--edge);border-radius:12px;padding:4px;width:min(100%,300px)}
.mode{border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.mode small{font-size:11px;letter-spacing:.04em;text-transform:none;font-weight:600;opacity:.85}
.mode[aria-checked="true"]{background:var(--cyan);color:var(--void);box-shadow:0 0 14px rgba(34,240,255,.45)}
.mode.daily[aria-checked="true"]{background:var(--pink);box-shadow:0 0 14px rgba(255,43,214,.45)}
.startpick{pointer-events:auto;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:4px;background:rgba(18,10,36,.85);border:1px solid var(--edge);border-radius:12px;padding:4px;width:min(100%,300px)}
.startpick button{border:0;background:none;color:var(--cyan);font-weight:700;font-size:20px;border-radius:9px;height:36px;cursor:pointer}
.startpick button[disabled]{opacity:.3;cursor:default}
.startpick span{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;line-height:1.2}
.startpick small{font-size:11px;letter-spacing:.04em;text-transform:none;font-weight:600;color:var(--dim)}
.startpick.on span{color:var(--volt)}
.mlist{pointer-events:auto;width:min(100%,340px);display:flex;flex-direction:column;gap:5px;margin-top:auto;text-align:left}
.mlist h4{margin:0 0 2px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.mis{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:rgba(18,10,36,.85);border:1px solid var(--edge);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600}
.mis .rw{font-weight:700;color:var(--volt);font-variant-numeric:tabular-nums;white-space:nowrap}
.mis .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--edge);overflow:hidden}
.mis .bar i{display:block;height:100%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.mis.done{border-color:var(--lime)}
.mis.done .bar i{background:var(--lime)}
.mis .new{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--void);background:var(--cyan);border-radius:4px;padding:0 5px;margin-right:6px}
.paused{background:rgba(7,3,15,.7);pointer-events:none}

.banner{position:absolute;left:0;right:0;top:84px;text-align:center;pointer-events:none;animation:ban 2.4s ease-out forwards}
.banner .k{font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--dim)}
.banner .n{font-family:var(--display);font-size:clamp(26px,8.5vw,40px);line-height:1.1;color:var(--volt);text-shadow:0 0 8px var(--volt),0 0 26px rgba(255,228,92,.55)}
.banner .h{margin:6px auto 0;max-width:300px;font-size:13px;font-weight:600;color:var(--text);background:rgba(7,3,15,.6);border-radius:8px;padding:4px 10px;display:inline-block}
@keyframes ban{0%{opacity:0;transform:scale(1.25)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-top:4px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:1px solid transparent;padding:6px 0;border-radius:10px;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--cyan);border-color:var(--edge);background:var(--night);text-shadow:0 0 8px var(--cyan)}
.dot{position:absolute;top:4px;right:calc(50% - 22px);width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink)}

/* shared */
h2{font-family:var(--body);font-weight:700;font-size:24px;margin:0;text-wrap:balance;letter-spacing:.02em}
h3{margin:0;font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--dim);font-size:14px;margin:0}
.fine{font-size:11px;color:var(--dim);margin:0}
.panel{background:var(--night);border:1px solid var(--edge);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;letter-spacing:.04em;cursor:pointer;background:var(--cyan);color:var(--void);box-shadow:0 0 16px rgba(34,240,255,.45);white-space:nowrap}
.btn.buy{background:var(--pink);color:var(--void);box-shadow:0 0 16px rgba(255,43,214,.5)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--edge);box-shadow:none}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn:active{transform:translateY(1px)}
.rar{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;border-radius:5px;padding:1px 6px;color:var(--dim)}
.rar.rare{color:var(--cyan)} .rar.epic{color:var(--volt)} .rar.premium{color:var(--pink)} .rar.exclusive{color:var(--lime)}

/* shop */
.hero{position:relative;overflow:hidden;border:1px solid var(--pink);box-shadow:0 0 24px rgba(255,43,214,.25),inset 0 0 40px rgba(255,43,214,.08)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pink)}
.herobody{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.heroname{font-weight:700;font-size:22px;line-height:1.1}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.offer{display:flex;align-items:center;gap:12px}
.offer .txt{flex:1;min-width:0}
.offer .t{font-weight:700;font-size:16px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--void);background:var(--volt);border-radius:4px;padding:1px 6px;margin-bottom:3px}
.lb{display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.lb div{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:6px 8px;border-radius:8px;font-size:14px;font-weight:600}
.lb .me{background:rgba(34,240,255,.1);color:var(--cyan);border:1px solid rgba(34,240,255,.35)}
.lb .rk{color:var(--dim)}

/* locker */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--night);border:1px solid var(--edge);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--edge);color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.skin{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--night);border:1px solid var(--edge);border-radius:12px;padding:10px 4px;cursor:pointer;text-align:center;min-width:0}
.skin.eq{border-color:var(--cyan);box-shadow:0 0 14px rgba(34,240,255,.3)}
.skin .nm{font-weight:700;font-size:13px;line-height:1.15}
.skin .st{font-size:11px;color:var(--dim)}
.skin.eq .st{color:var(--cyan)}
.stats{border:1px dashed var(--edge);border-radius:12px;padding:12px;font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
.stats b{color:var(--text);font-variant-numeric:tabular-nums}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(4,2,10,.82);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));overflow-y:auto}
.mcard{width:100%;max-width:360px;background:var(--night);border:1px solid var(--edge);border-radius:18px;padding:20px 16px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 40px rgba(255,43,214,.2);animation:min .25s ease-out}
@keyframes min{from{transform:scale(.9);opacity:0}}
.mcard .col{display:flex;flex-direction:column;gap:8px}
.wreck{font-family:var(--display);font-size:34px;font-weight:400;color:var(--pink);text-shadow:0 0 8px var(--pink),0 0 24px rgba(255,43,214,.6);margin:0;line-height:1.1}
.big{font-weight:700;font-size:48px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 12px var(--cyan)}
.newbest{color:var(--volt);font-weight:700;letter-spacing:.16em;text-shadow:0 0 10px var(--volt)}
.brk{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;font-size:13px;font-weight:600;color:var(--dim);background:var(--void);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;font-variant-numeric:tabular-nums}
.brk b{color:var(--volt);text-align:right}
.brk .tot{color:var(--text);border-top:1px solid var(--edge);padding-top:5px;margin-top:2px}
.crate{background:none;border:0;cursor:pointer;width:140px;margin:0 auto;animation:jit 1.2s infinite}
.crate svg{width:100%;display:block}
.crate.crack{animation:burst .5s ease-in forwards}
@keyframes jit{0%,70%,100%{transform:none}75%{transform:rotate(-5deg)}85%{transform:rotate(5deg)}}
@keyframes burst{50%{transform:scale(1.15)}100%{transform:scale(1.8);opacity:0}}
.reveal{margin:0 auto;animation:pin .5s cubic-bezier(.34,1.6,.64,1)}
@keyframes pin{from{transform:scale(0) rotate(-45deg)}}
.flex{width:100%;border-radius:12px;display:block;box-shadow:0 0 30px rgba(255,43,214,.35)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:6px 0;border-bottom:1px solid var(--edge);font-weight:600}
.setrow small{display:block;color:var(--dim);font-size:12px;font-weight:500}
.sw{position:relative;width:52px;height:30px;border-radius:15px;border:1px solid var(--edge);background:var(--void);cursor:pointer;flex:none;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--cyan);border-color:var(--cyan)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:var(--void)}
.danger{background:none;border:1px solid #FF2B5E;color:#FF6B8A;border-radius:10px;padding:11px;font-weight:700;cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--void);font-weight:700;font-size:14px;border-radius:8px;padding:9px 14px;box-shadow:0 0 20px rgba(34,240,255,.5);max-width:calc(100% - 40px);text-align:center}

@media (max-height:640px){.ready{padding-top:84px;gap:6px}.ready .mis{padding:4px 8px;font-size:12px}.ready .mis:nth-of-type(n+3){display:none}.mlist h4{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">HYPERLINE</div>
    <div class="cred" aria-label="Credits"><i></i><span id="credCount">0</span></div>
    <button class="icon" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>

  <section class="view" id="view-run">
    <div class="stage" id="stage">
      <canvas id="game" aria-label="Runner game. Tap or hold to jump."></canvas>
      <div class="hud">
        <div class="dist"><span id="distTxt">0</span>m<small id="bestTxt">BEST 0m</small><small class="sec" id="secTxt">SECTOR 1</small></div>
        <div class="hudr"><div class="chips"><i></i><span id="chipTxt">0</span><span class="mult" id="multTxt" hidden>x2</span></div>
          <button class="pause" id="pauseBtn" data-act="pause" aria-label="Pause" hidden><svg viewBox="0 0 14 14" fill="currentColor"><rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/></svg></button></div>
      </div>
      <div class="banner" id="banner" hidden><div class="k" id="banK">SECTOR 1</div><div class="n" id="banN">NEON DISTRICT</div><div class="h" id="banH"></div></div>
      <div class="overlay ready" id="ready">
        <div class="modes" role="radiogroup" aria-label="Mode">
          <button class="mode" role="radio" data-act="mode" data-mode="endless" aria-checked="true">Endless<small id="modeBestE">Best 0m</small></button>
          <button class="mode daily" role="radio" data-act="mode" data-mode="daily" aria-checked="false">Daily run<small id="modeBestD">Today 0m</small></button>
        </div>
        <div class="startpick" id="startPick" hidden>
          <button data-act="start" data-d="-1" aria-label="Start one sector earlier">‹</button>
          <span id="startTxt">Start · Sector 1</span>
          <button data-act="start" data-d="1" aria-label="Start one sector later">›</button>
        </div>
        <div class="go">TAP TO RUN</div>
        <p id="readySub">Tap to jump · hold to keep jumping</p>
        <div class="mlist" id="readyMissions"></div>
      </div>

<script type="module">
// iOS Safari pinch-zoom guard (gesturestart ignores touch-action)
document.addEventListener('gesturestart', (e) => e.preventDefault());
import { createStudio, resolveEndpoint } from '../sdk/studio-sdk.js';
import { createCourse, extendCourse, pruneCourse } from './lib/course.js';
import { createRunner, step } from './lib/sim.js';
import { P, PS, STEP, sectorAt, sectorInfo, speedAt } from './lib/world.js';
import { dailySeed, msToNextUtcDay, utcDay } from './lib/rng.js';
import { applyEvent, checkMissions, chipMultiplier, clampStart, isPractice, sectorFromSearch, migrateSave, sectorStart, missionById, missionProgress, NEAR_CR, newRunStats, rollMission, runCredits } from './lib/meta.js';
import { createGhostRecorder, finishGhost, ghostAt, recordGhost, validGhost } from './lib/ghost.js';
import { createBloom, drawScene, drawSkinThumb, makeShards, SHARD_LIFE, skinColors } from './render.js';
import { createAudio } from './audio.js';

const studio = createStudio({ game: 'hyperline', version: '0.11.1', endpoint: resolveEndpoint(location, window.STUDIO_CONFIG) });
const $ = (id) => document.getElementById(id);
const audio = createAudio();
const RM = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = RM.matches;
RM.addEventListener?.('change', (e) => { reduced = e.matches; });

/* ---------- skins ---------- */
const SKINS = [
  { id: 'volt', name: 'Volt', rar: 'common', a: '#22F0FF', b: '#2B6BFF', shape: 'square', src: 'crate' },
  { id: 'ember', name: 'Ember', rar: 'common', a: '#FF8A3D', b: '#FF2B5E', shape: 'square', src: 'crate' },
  { id: 'mint', name: 'Mint', rar: 'common', a: '#7CFF6B', b: '#11B989', shape: 'square', src: 'crate' },
  { id: 'vapor', name: 'Vapor', rar: 'rare', a: '#FF2BD6', b: '#7A2BFF', shape: 'circle', src: 'crate' },
  { id: 'hexa', name: 'Hexa', rar: 'rare', a: '#B98CFF', b: '#22F0FF', shape: 'hex', src: 'crate' },
  { id: 'aurum', name: 'Aurum', rar: 'epic', a: '#FFE45C', b: '#FF9F1C', shape: 'diamond', src: 'crate' },
  { id: 'glitch', name: 'Glitch', rar: 'epic', a: '#FFFFFF', b: '#8A8AFF', shape: 'square', fx: 'glitch', src: 'crate' },
  { id: 'serpent', name: 'Chrome Serpent', rar: 'premium', a: '#E6E9FF', b: '#8C93C7', shape: 'hex', fx: 'rainbow', src: 'shop' },
  { id: 'apex', name: 'Apex', rar: 'exclusive', a: '#FF2BD6', b: '#FFE45C', shape: 'diamond', fx: 'rainbow', src: 'best' },
];
const SK = Object.fromEntries(SKINS.map((s) => [s.id, s]));
const SHAPE_NAME = { square: 'Cube', circle: 'Sphere', hex: 'Hex prism', diamond: 'Octahedron' };
const CRATE_EVERY = 5, REVIVE_CR = 150, DUP_BACK = 60, APEX_AT = 1500;
/* Credits unlock one specific crate skin directly, so nothing random is ever bought. */
const UNLOCK_CR = { common: 300, rare: 700, epic: 1400 };

/* Trails: a separate cosmetic, unlocked directly with credits. Always a specific item, never random. */
const TRAILS = [
  { id: 'classic', name: 'Pixel', cost: 0, desc: 'Squares in your skin colour' },
  { id: 'comet', name: 'Comet', cost: 400, desc: 'A long glowing tail' },
  { id: 'sparks', name: 'Sparks', cost: 600, desc: 'A thin gold filament' },
  { id: 'ribbon', name: 'Ribbon', cost: 800, desc: 'A solid neon ribbon' },
  { id: 'binary', name: 'Binary', cost: 1000, desc: 'Leaves ones and zeros behind' },
  { id: 'prism', name: 'Prism', cost: 1500, desc: 'A full-spectrum ribbon' },
];
const TR = Object.fromEntries(TRAILS.map((t) => [t.id, t]));

/* Shop catalog: the only place real-money items and prices are defined. */
const CATALOG = {
  revive: { sku: 'hyperline.revive', title: 'Revive', priceUsd: 0.99 },
  stack: { sku: 'hyperline.credits_500', title: 'Stack · 500 credits', priceUsd: 0.99 },
  vault: { sku: 'hyperline.credits_3000', title: 'Vault · 3,000 credits', priceUsd: 4.99 },
  serpent: { sku: 'hyperline.skin_serpent', title: 'Chrome Serpent skin', priceUsd: 2.99 },
};
const CREDIT_GRANT = { stack: 500, vault: 3000 };
const price = (item) => `$${item.priceUsd.toFixed(2)}`;

/* Neon Crate odds. Crates are earned from play only (one every CRATE_EVERY runs), never sold.
   Each tier's share is split evenly across its skins; weights sum to 1. */
const TIER = { common: 0.62, rare: 0.30, epic: 0.08 };
const CRATE_POOL = SKINS.filter((s) => s.src === 'crate');
const CRATE_TABLE = CRATE_POOL.map((s) => ({ label: s.name, weight: TIER[s.rar] / CRATE_POOL.filter((p) => p.rar === s.rar).length, id: s.id }));
const oddsTxt = () => studio.odds.format(CRATE_TABLE);

/* ---------- save ---------- */
/* The storage key is the one v1 used, so existing progress is found; migrateSave brings it to v3. */
const KEY = 'hyperline_v1', GKEY = 'hyperline_ghosts';
function load() { try { return migrateSave(JSON.parse(localStorage.getItem(KEY))); } catch (e) { return migrateSave(null); } }
let S = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage blocked: play on */ } };
save();
function loadGhosts() {
  try {
    const g = JSON.parse(localStorage.getItem(GKEY)) || {};
    return { endless: validGhost(g.endless) ? g.endless : null,
      daily: g.daily && typeof g.daily.day === 'string' && validGhost(g.daily.g) ? g.daily : null };
  } catch (e) { return { endless: null, daily: null }; }
}
let GH = loadGhosts();
const saveGhosts = () => { try { localStorage.setItem(GKEY, JSON.stringify(GH)); } catch (e) { /* too big or blocked */ } };
/* The player's own best endless runs. A revived run updates its entry instead of adding a second one. */
function recordRun(run, d) {
  const e = run > 0 && S.top.find((r) => r.run === run);
  if (e) { e.d = Math.max(e.d, d); e.at = Date.now(); } else S.top.push({ run, d, at: Date.now() });
  S.top.sort((a, b) => b.d - a.d); S.top = S.top.slice(0, 5);
}
const today = () => utcDay(Date.now());
const dailyBest = () => (S.daily.day === today() ? S.daily.best : 0);

/* ---------- ui helpers ---------- */
const modal = $('modal'), mcard = $('mcard');
let toastT;
function toast(m) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2200);
}
function showModal(h) { mcard.innerHTML = h; modal.hidden = false; paintThumbs(mcard); const b = mcard.querySelector('button'); if (b) b.focus({ preventScroll: true }); }
const closeModal = () => { modal.hidden = true; };
function cred() { $('credCount').textContent = S.credits.toLocaleString(); $('shopDot').hidden = !S.crates; }
const fmt = (n) => Math.floor(n).toLocaleString();
const buzz = (p) => { if (S.settings.haptics) try { navigator.vibrate && navigator.vibrate(p); } catch (e) { /* unsupported */ } };

function paintCanvas(cv, t) {
  if (cv.dataset.trail) { paintTrail(cv, t || 1.3); return; }
  const s = +cv.dataset.size, d = Math.min(2, window.devicePixelRatio || 1);
  if (cv.width !== s * d) { cv.width = s * d; cv.height = s * d; cv.style.width = s + 'px'; cv.style.height = s + 'px'; }
  const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, s, s);
  drawSkinThumb(x, SK[cv.dataset.skin], s / 2, s / 2, s * 0.46, t || 1.3, cv.dataset.locked === '1');
}
function paintThumbs(root, t) { root.querySelectorAll('canvas[data-skin],canvas[data-trail]').forEach((cv) => paintCanvas(cv, t)); }
const thumb = (id, size, locked, extra) => `<canvas data-skin="${id}" data-size="${size}" data-locked="${locked ? 1 : 0}" ${extra || ''}></canvas>`;
function paintTrail(cv, t) {
  const s = +cv.dataset.size, d = Math.min(2, window.devicePixelRatio || 1), id = cv.dataset.trail, locked = cv.dataset.locked === '1';
  if (cv.width !== s * d) { cv.width = s * d; cv.height = s * d; cv.style.width = s + 'px'; cv.style.height = s + 'px'; }
  const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, s, s);
  const [a, b] = skinColors(SK[S.eq], t), n = 16;
  const pt = (i) => ({ x: s * 0.08 + (i / n) * s * 0.7, y: s * 0.55 - Math.sin((i / n) * Math.PI) * s * 0.3 });
  x.globalAlpha = locked ? 0.35 : 1;
  for (let i = 1; i <= n; i++) {
    const p = pt(i), q = pt(i - 1), k = i / n;
    if (id === 'classic') { x.fillStyle = a; const z = 2 + k * 5; x.globalAlpha = (locked ? 0.35 : 1) * k; x.fillRect(p.x - z / 2, p.y - z / 2, z, z); }
    else if (id === 'binary') { x.fillStyle = '#7CFF6B'; x.globalAlpha = (locked ? 0.35 : 1) * k; x.font = '700 9px monospace'; x.fillText(i % 3 ? '1' : '0', p.x, p.y); }
    else { x.beginPath(); x.moveTo(q.x, q.y); x.lineTo(p.x, p.y); x.lineCap = 'round';
      x.strokeStyle = id === 'prism' ? `hsl(${(i * 22) % 360},100%,60%)` : id === 'sparks' ? '#FFE45C' : id === 'ribbon' ? b : a;
      x.lineWidth = id === 'sparks' ? 1.5 : id === 'comet' ? 1 + k * 7 : 7; x.globalAlpha = (locked ? 0.35 : 1) * (0.3 + k * 0.7); x.stroke(); }
  }
  x.globalAlpha = 1;
  const e = pt(n); x.fillStyle = locked ? '#3A2A6A' : a; x.fillRect(e.x - 5, e.y - 5, 10, 10);
}

/* ---------- purchases (fake-door via the studio SDK) ---------- */
/* Items the player passed on this session. Their buttons are hidden so we never re-prompt. */
const passed = new Set();
let buying = false;
async function buy(key) {
  if (buying || passed.has(key)) return false;
  buying = true;
  try { const r = await studio.purchase.offer(CATALOG[key]); if (r === 'granted') return true; passed.add(key); return false; }
  finally { buying = false; }
}

/* ---------- game ---------- */
// The scene is drawn on an off-screen 2D canvas, then shown on #game: through three.js with a neon bloom
// when WebGL works, or by a plain copy (the original look) when it doesn't.
let cv = $('game'), out2d = null, bloom = null;
const src = document.createElement('canvas'), cx = src.getContext('2d'), stage = $('stage');
let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1), dprCap = DPR;
function resize() {
  const r = stage.getBoundingClientRect(); DPR = Math.min(dprCap, window.devicePixelRatio || 1);
  W = r.width; H = r.height; if (!W || !H) return;
  src.width = Math.round(W * DPR); src.height = Math.round(H * DPR);
  if (bloom) bloom.resize(src.width, src.height); else if (out2d) { cv.width = src.width; cv.height = src.height; }
}
function useFlat() {
  if (bloom) bloom.dispose();
  bloom = null;
  const n = document.createElement('canvas'); n.id = 'game'; n.setAttribute('aria-label', cv.getAttribute('aria-label') || '');
  cv.replaceWith(n); cv = n; out2d = cv.getContext('2d'); resize();
}
createBloom(cv, src).then((b) => { if (!b) { useFlat(); return; } bloom = b; b.onLost(useFlat); resize(); }).catch(useFlat);
new ResizeObserver(resize).observe(stage);

let G, pressed = false;
/* Practice start: endless runs may begin at any sector already reached. Free, and never saved as a BEST or ghost. */
// ?sector=N in the page address opens the picker up to N (read locally, never saved or sent); S.far is untouched.
const urlSector = sectorFromSearch(location.search);
let pick = urlSector || 1;
const reach = () => Math.max(S.far, urlSector);
const startFor = (mode) => (mode === 'endless' ? clampStart(pick, reach()) : 1);
function makeCourse(mode, start = 1) {
  const from = sectorStart(start);
  const c = createCourse(mode === 'daily' ? dailySeed(today()) : (Math.random() * 4294967296) >>> 0, from);
  extendCourse(c, from + 90);
  return c;
}
function runnerAt(start) { const r = createRunner(); r.x += sectorStart(start); return r; }
function reset() {
  const start = startFor(S.mode);
  G = { state: 'ready', mode: S.mode, start, course: makeCourse(S.mode, start), runner: runnerAt(start), stats: newRunStats(S.mode, start), simT: 0, acc: 0,
    t: G ? G.t : 0, shake: 0, flash: 0, parts: [], pops: [], ripples: [], lightTrail: [], shards: [], trail: [], buf: 0, cont: false, awarded: 0, run: 0, counted: false,
    blink: 0, lift: 0, flipT: 0, doneM: [], ghost: null, rec: null, day: today(), trailTick: 0 };
  $('ready').hidden = false; $('paused').hidden = true; $('pauseBtn').hidden = true;
  renderReady(); hud();
}
function startRun() {
  // Run the course shown behind the ready screen, unless the mode or the UTC day changed since.
  const start = startFor(S.mode);
  if (G.mode !== S.mode || G.day !== today() || G.start !== start) G.course = makeCourse(S.mode, start);
  S.runs++; G.run = S.runs; G.mode = S.mode; G.day = today(); G.start = start;
  G.runner = runnerAt(start); G.stats = newRunStats(G.mode, start);
  // Ghosts replay a run from sector 1, so a practice start races no ghost.
  G.ghost = start > 1 ? null : G.mode === 'daily' ? (GH.daily && GH.daily.day === G.day ? GH.daily.g : null) : GH.endless;
  G.rec = createGhostRecorder(); G.simT = 0; G.acc = 0;
  G.state = 'run'; $('ready').hidden = true; $('pauseBtn').hidden = false;
  save();
  studio.track('level_start', { level: 1, run: S.runs, mode: G.mode, start });
  audio.startBeat(start - 1);
  banner(start - 1);
}

/* particles live in world space and are projected like everything else */
function spawn(x, y, n, col, spd, life, size, up = 0) {
  if (reduced) n = Math.ceil(n / 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, b = Math.random() * Math.PI - Math.PI / 2, v = spd * (0.3 + Math.random());
    G.parts.push({ x, y, z: 0, vx: Math.cos(a) * Math.cos(b) * v, vy: Math.sin(b) * v + up, vz: Math.sin(a) * Math.cos(b) * v, life, max: life, col, size: size * (0.5 + Math.random()) });
  }
}
function pop(text, x, y, col, size = 18) { G.pops.push({ text, x, y, col, size, age: 0, life: 0.9 }); }

let banT;
function banner(i) {
  const s = sectorInfo(i), b = $('banner');
  $('banK').textContent = `SECTOR ${i + 1}`; $('banN').textContent = s.name; $('banH').textContent = s.hint;
  b.hidden = true; void b.offsetWidth; b.hidden = false;
  clearTimeout(banT); banT = setTimeout(() => { b.hidden = true; }, 2600);
}

function simStep() {
  const r = G.runner, jump = pressed || G.buf > 0;
  if (G.buf > 0) G.buf -= STEP;
  const ev = step(r, G.course, jump);
  G.simT += STEP;
  recordGhost(G.rec, G.simT, r.x, r.y, r.flip);
  const cxw = r.x + PS / 2, cyw = r.y + PS / 2, sk = SK[S.eq];
  for (const e of ev) {
    switch (e.t) {
      case 'jump': G.buf = 0; G.squash = -1; audio.jump(); spawn(cxw, r.flip ? r.y + PS : r.y, 5, '#FFFFFF', 3, 0.25, 0.08); break;
      case 'land':
        G.squash = 1;
        spawn(cxw, r.flip ? r.y + PS : r.y, 7, sk.a, 4, 0.3, 0.1);
        G.ripples.push({ x: cxw, flip: r.flip, age: 0 }); if (G.ripples.length > 4) G.ripples.shift();
        if (e.spikes >= 3) pop(`${e.spikes} IN ONE JUMP`, cxw, cyw + 0.8, '#7CFF6B', 16);
        G.stats = applyEvent(G.stats, e); break;
      case 'chip': {
        const before = chipMultiplier(G.stats.streak);
        G.stats = applyEvent(G.stats, e); audio.chip(G.stats.streak);
        spawn(e.x, e.y, 10, '#FFE45C', 5, 0.4, 0.1);
        const m = chipMultiplier(G.stats.streak);
        if (m > before) { pop(`STREAK x${m}`, e.x, e.y + 0.6, '#FFE45C', 18); buzz(15); }
        break; }
      case 'chipMiss':
        if (G.stats.streak >= 8) pop('streak reset', cxw, cyw + 0.9, '#A08FC7', 13);
        G.stats = applyEvent(G.stats, e); break;
      case 'near':
        G.stats = applyEvent(G.stats, e); audio.near(); buzz(10);
        pop(`CLOSE! +${NEAR_CR}`, e.x, e.y + 0.4, '#22F0FF', 20);
        spawn(e.x, e.y, 8, '#22F0FF', 4, 0.35, 0.08);
        spawn(r.x + PS, r.flip ? r.y + PS : r.y, 5, '#22F0FF', 2.5, 0.22, 0.06);
        G.nearFlash = reduced ? 0.25 : 0.5; break;
      case 'pad': G.stats = applyEvent(G.stats, e); audio.pad(); spawn(cxw, r.y, 14, '#7CFF6B', 5, 0.45, 0.1, 4); break;
      case 'bar': G.stats = applyEvent(G.stats, e); break;
      case 'gate': pop('THREADED', cxw, cyw + 0.9, '#FFE45C', 15); spawn(cxw, cyw, 8, '#FFE45C', 4, 0.35, 0.08); break;
      case 'flipIn': audio.flip(); break;
      case 'flipOut': audio.flip(); G.stats = applyEvent(G.stats, e); break;
      case 'die': die(); return;
    }
  }
  G.stats.dist = r.x - P;
  const sec = sectorAt(G.stats.dist) + 1;
  if (sec > G.stats.sector) {
    G.stats = applyEvent(G.stats, { t: 'sector', sector: sec });
    banner(sec - 1); audio.sector(); audio.setSector(sec - 1);
    studio.track('custom', { event: 'sector_reached', sector: sec, mode: G.mode, run: G.run });
    if (sec > S.far && G.start <= S.far) { S.far = sec; save(); } // a ?sector= jump past your progress doesn't count as reached
  }
  for (const id of checkMissions(S.missions, G.stats)) {
    if (G.doneM.includes(id)) continue;
    const m = missionById(id);
    G.doneM.push(id); S.credits += m.reward; save(); cred();
    audio.mission(); buzz([20, 40, 20]);
    toast(`Mission complete · +${m.reward} credits`);
    studio.track('custom', { event: 'mission_complete', id, reward: m.reward, mode: G.mode, run: G.run });
  }
  G.lightTrail.push({ x: cxw, y: cyw, age: 0 });
  if (++G.trailTick % 2 === 0) {
    G.trail.push({ x: cxw, y: cyw, k: Math.random() }); if (G.trail.length > 26) G.trail.shift();
    if (S.trail === 'sparks' && !reduced && Math.random() < 0.5) G.parts.push({ x: cxw - 0.3, y: cyw + (Math.random() - 0.5) * 0.5, z: (Math.random() - 0.5) * 0.5, vx: -2, vy: Math.random() * 2, vz: 0, life: 0.4, max: 0.4, col: '#FFE45C', size: 0.07 });
  }
  if (G.trailTick % 240 === 0) pruneCourse(G.course, r.x);
}

function die() {
  const r = G.runner, sk = SK[S.eq];
  G.state = 'dead'; G.shake = reduced ? 0 : 0.5; G.flash = 0.5;
  spawn(r.x + PS / 2, r.y + PS / 2, 46, sk.a, 9, 0.9, 0.16, 2); spawn(r.x + PS / 2, r.y + PS / 2, 20, '#FF2BD6', 7, 0.7, 0.12, 2);
  G.shards = makeShards(r.x + PS / 2, r.y + PS / 2, 9, Math.random);
  audio.death(); audio.stopBeat(); buzz(70);
  $('pauseBtn').hidden = true;
  setTimeout(showDeath, 750);
}

let lastDeath = null;
function showDeath() {
  const st = G.stats, dist = Math.floor(st.dist), total = runCredits(st), delta = total - G.awarded;
  G.awarded = total; S.credits += delta;
  let prevBest, newBest;
  const practice = isPractice(st);
  if (practice) { prevBest = S.best; newBest = false; } // practice never sets BEST, ghosts or top runs
  else if (G.mode === 'daily') {
    if (S.daily.day !== G.day) S.daily = { day: G.day, best: 0 };
    prevBest = S.daily.best; newBest = dist > prevBest;
    if (newBest) { S.daily.best = dist; GH.daily = { day: G.day, g: finishGhost(G.rec) }; saveGhosts(); }
  } else {
    prevBest = S.best; newBest = dist > prevBest;
    if (newBest) { S.best = dist; GH.endless = finishGhost(G.rec); saveGhosts(); }
    recordRun(G.run || 0, dist);
  }
  let crate = false;
  if (!G.counted) { G.counted = true; if (S.runs % CRATE_EVERY === 0) { S.crates++; crate = true; } }
  const apex = !practice && !S.owned.apex && dist >= APEX_AT; if (apex) S.owned.apex = 1;
  // Swap completed missions for the next ones in the list.
  const done = G.doneM.map((id) => missionById(id));
  for (const id of G.doneM) {
    const i = S.missions.indexOf(id); if (i < 0) continue;
    const m = rollMission(S.missionSeq, S.missions); S.missions[i] = m.id; S.missionSeq = m.seq;
  }
  const fresh = G.doneM.length ? S.missions.filter((id) => !lastActive.includes(id)) : [];
  G.doneM = [];
  save(); cred(); hud();

    <p class="fine">Hyperline 0.3.0 · Nothing you do here leaves your device except anonymous play events.</p>
    <div class="col"><button class="btn ghost" data-act="close">Done</button></div>`);
}

/* ---------- tabs & actions ---------- */
function showTab(n) {
  ['run', 'shop', 'locker'].forEach((k) => { $('view-' + k).hidden = k !== n; $('tab-' + k).setAttribute('aria-selected', k === n ? 'true' : 'false'); });
  pressed = false;
  if (n !== 'run' && G.state === 'run') pause();
  if (n === 'shop') { renderShop(); studio.track('custom', { event: 'shop_view', crates: S.crates, credits: S.credits }); }
  if (n === 'locker') renderLocker();
  if (n === 'run') { requestAnimationFrame(resize); if (G.state === 'ready') renderReady(); }
}
function refresh() { cred(); if (!$('view-shop').hidden) renderShop(); if (!$('view-locker').hidden) renderLocker(); if (G.state === 'ready') renderReady(); }
document.addEventListener('click', async (e) => {
  const tb = e.target.closest('[data-tab]'); if (tb) { showTab(tb.dataset.tab); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const a = b.dataset.act; if (a !== 'reset') resetArm = false;
  switch (a) {
    case 'revive-buy': b.disabled = true;
      if (await buy('revive')) revive();
      else b.remove(); /* declined or suppressed: drop the paid option, no re-prompt */
      break;
    case 'revive-cr': if (S.credits < REVIVE_CR) break; S.credits -= REVIVE_CR; save(); cred(); revive(); break;
    case 'again': closeModal(); reset(); studio.feedback.maybePrompt(); break;
    case 'menu': closeModal(); reset(); break;
    case 'close': closeModal(); break;
    case 'mode': if (G.state !== 'ready') break; S.mode = b.dataset.mode === 'daily' ? 'daily' : 'endless'; save(); audio.click(); reset(); break;
    case 'start': if (G.state !== 'ready' || S.mode !== 'endless') break;
      pick = clampStart(startFor('endless') + Number(b.dataset.d), reach()); audio.click(); reset(); break;
    case 'pause': pause(); break;
    case 'settings': pause(); showSettings(); break;
    case 'set': {
      const k = b.dataset.key; S.settings[k] = !S.settings[k]; save(); b.setAttribute('aria-checked', String(S.settings[k]));
      if (k === 'sound') audio.setSound(S.settings.sound);
      if (k === 'music') { audio.setMusic(S.settings.music); if (S.settings.music && G.state === 'run') audio.startBeat(G.stats.sector - 1); }
      if (k === 'haptics' && S.settings.haptics) buzz(20);
      break; }
    case 'crate': if (!S.crates) { toast(`Crates are earned: one every ${CRATE_EVERY} runs`); break; }
      showModal(`<div class="eyebrow">Neon Crate</div><button class="crate" data-act="crack" aria-label="Open the crate">${CRATE_SVG}</button><p class="muted">Tap to crack it open</p><p class="fine">Odds: ${oddsTxt()}</p>`); break;
    case 'crack': if (!S.crates) break; S.crates--; S.opened++; save(); b.classList.add('crack'); b.disabled = true;
      setTimeout(() => { const r = rollCrate(); refresh(); showPull(r.s, r.dup); }, 480); break;
    case 'buy': { const k = b.dataset.item; b.disabled = true;
      if (await buy(k)) {
        if (k === 'serpent') { S.owned.serpent = 1; save(); showPull(SK.serpent, false, 'Yours now'); }
        else { S.credits += CREDIT_GRANT[k]; save(); toast(`+${CREDIT_GRANT[k].toLocaleString()} credits`); }
      }
      refresh(); break; }
    case 'flex': showFlex(b.dataset.skin); break;
    case 'equip': S.eq = b.dataset.skin; save(); toast(SK[S.eq].name + ' equipped'); closeModal(); if (!$('view-locker').hidden) renderLocker(); break;
    case 'ltab': lockerTab = b.dataset.l === 'trails' ? 'trails' : 'skins'; renderLocker(); break;
    case 'skin': { const id = b.dataset.skin; if (S.owned[id]) { S.eq = id; save(); renderLocker(); toast(SK[id].name + ' equipped'); }
      else if (SK[id].src === 'best') toast(`Reach ${fmt(APEX_AT)}m in one run to unlock Apex`);
      else if (SK[id].src === 'crate') showUnlock(id);
      else showTab('shop'); break; }
    case 'unlock': { const id = b.dataset.skin, cost = UNLOCK_CR[SK[id].rar]; if (S.owned[id] || S.credits < cost) break;
      S.credits -= cost; S.owned[id] = 1; save(); closeModal(); refresh(); toast(SK[id].name + ' unlocked');
      studio.track('custom', { event: 'skin_unlock', id, cost }); break; }
    case 'trail': { const id = b.dataset.trail; if (S.trails[id]) { S.trail = id; save(); renderLocker(); toast(TR[id].name + ' trail equipped'); } else showTrailUnlock(id); break; }
    case 'trail-unlock': { const id = b.dataset.trail, t = TR[id]; if (!t || S.trails[id] || S.credits < t.cost) break;
      S.credits -= t.cost; S.trails[id] = 1; S.trail = id; save(); closeModal(); refresh(); toast(t.name + ' trail unlocked and equipped');
      studio.track('custom', { event: 'trail_unlock', id, cost: t.cost }); break; }
    case 'reset': if (!resetArm) { resetArm = true; b.textContent = 'Tap again to erase everything'; break; }
      resetArm = false; S = migrateSave(null); GH = { endless: null, daily: null }; save(); saveGhosts(); lastActive = [...S.missions];
      cred(); closeModal(); reset(); refresh(); toast('Progress reset'); break;
  }
});

/* ---------- loop ---------- */
let last = performance.now(), slow = 0, frames = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!$('view-run').hidden) {
    if (G.state !== 'paused') update(dt);
    draw();
    // Adaptive resolution: if frames run long, step the canvas resolution down (never below 1x).
    frames++; if (dt > 1 / 45) slow++;
    if (frames >= 90) { if (slow > 45 && dprCap > 1) { dprCap = Math.max(1, dprCap - 0.5); resize(); } frames = 0; slow = 0; }
  } else {
    G.t += dt;
    const h = $('heroSkin');
    if (h && !reduced) paintCanvas(h, G.t);
  }
  if (!modal.hidden && !reduced) mcard.querySelectorAll('canvas.spin').forEach((h) => paintCanvas(h, G.t));
  requestAnimationFrame(loop);
}
// ---- hal hook (test only; inert without ?hal) ----
// Hal's before/after shots: view(x) starts a run on the course behind the ready screen, puts the runner at distance x
// and freezes there (paused, with no pause screen), so the frame shows that part of the course and its sector banner.
// Nothing here touches the network; Hal's browser blocks every request but the local game server.
if (new URLSearchParams(location.search).has('hal')) {
  window.__hal = {
    view(x) {
      if (G.state !== 'run' && G.state !== 'paused') startRun();
      extendCourse(G.course, x + 120);
      Object.assign(G.runner, { x, y: 0, vy: 0, grounded: true, flip: false, dead: '' });
      G.state = 'paused'; $('paused').hidden = true; $('ready').hidden = true; $('pauseBtn').hidden = true;
      Object.assign(G.stats, { dist: x, sector: sectorAt(x) + 1 }); hud(); // the HUD agrees with the frame
      banner(sectorAt(x));
      return { x, sector: sectorAt(x) };
    },
  };
}
// ---- end hal hook ----

audio.setSound(S.settings.sound); audio.setMusic(S.settings.music);
reset(); cred(); resize(); requestAnimationFrame(loop);
</script>

</body>
