<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hyperline · runner lab</title>
<style>
:root{--void:#07040F;--text:#F2ECFF;--dim:#A08FC7;--cyan:#22F0FF;--edge:#2A1F48}
html,body{margin:0;height:100%;background:var(--void);color:var(--text);font:600 14px system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:linear-gradient(transparent,rgba(7,4,15,.9))}
button{border:1px solid var(--edge);background:rgba(18,10,36,.85);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
button.on{border-color:var(--cyan);box-shadow:0 0 12px rgba(34,240,255,.4)}
.sw{width:34px;height:34px;padding:0;border-radius:50%}
.info{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:16px;color:var(--dim);font-size:12px;line-height:1.5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="info" id="info">Runner lab · loading</div>
<div class="bar" id="bar"></div>
<script type="module">
// Runner lab (dev only): the runner candidates (all Quaternius, CC0) built by lib/rig.js from models/*.js, in our own neon
// materials and bloom, on a moving track at roughly the game's camera angle. Data only; nothing is fetched at runtime
// beyond the game's own files.
import * as T from '../sdk/vendor/three.module.js';
import robot from './models/robot.js';
import heroM from './models/hero-male.js';
import heroF from './models/hero-female.js';
import { buildRig } from './lib/rig.js';
import { applyOutfit, outfitMaterial, OUTFITS, setVisor, tagParts } from './outfit3d.js';

const SKINS = [
  { id: 'volt', a: '#22F0FF', b: '#2B6BFF' }, { id: 'ember', a: '#FF8A3D', b: '#FF2B5E' }, { id: 'mint', a: '#7CFF6B', b: '#11B989' },
  { id: 'vapor', a: '#FF2BD6', b: '#7A2BFF' }, { id: 'hexa', a: '#B98CFF', b: '#22F0FF' }, { id: 'aurum', a: '#FFE45C', b: '#FF9F1C' },
  { id: 'glitch', a: '#FFFFFF', b: '#8A8AFF' }, { id: 'serpent', a: '#E6E9FF', b: '#8C93C7' }, { id: 'apex', a: '#FF2BD6', b: '#FFE45C' },
];
const cv = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.toneMapping = T.ACESFilmicToneMapping;
const scene = new T.Scene();
scene.background = new T.Color('#07040F');
scene.fog = new T.FogExp2('#12082A', 0.045);
const cam = new T.PerspectiveCamera(52, 1, 0.1, 200);
cam.position.set(-2.6, 2.3, 6.8);
cam.lookAt(0.9, 0.9, 0);

scene.add(new T.HemisphereLight('#6A4CFF', '#090314', 0.9));
const key = new T.DirectionalLight('#FF7AE6', 1.6); key.position.set(-4, 6, 3); scene.add(key);
const rim = new T.DirectionalLight('#22F0FF', 2.2); rim.position.set(3, 3, -5); scene.add(rim);

// Track: a dark slab with cyan edge rails and scrolling cross lines; a sun disc and a skyline wall far off.
const track = new T.Group(); scene.add(track);
const slab = new T.Mesh(new T.BoxGeometry(400, 0.2, 3), new T.MeshStandardMaterial({ color: '#0B0618', roughness: 0.6, metalness: 0.3 }));
slab.position.set(0, -0.1, 0); track.add(slab);
const railMat = new T.MeshBasicMaterial({ color: '#22F0FF', toneMapped: false });
for (const z of [-1.5, 1.5]) { const r = new T.Mesh(new T.BoxGeometry(400, 0.05, 0.05), railMat); r.position.set(0, 0.02, z); track.add(r); }
const lineMat = new T.MeshBasicMaterial({ color: '#7A2BFF', toneMapped: false, transparent: true, opacity: 0.55 });
const lines = new T.InstancedMesh(new T.BoxGeometry(0.04, 0.01, 3), lineMat, 80);
const tmp = new T.Object3D();
scene.add(lines);
const sun = new T.Mesh(new T.CircleGeometry(14, 48), new T.MeshBasicMaterial({ color: '#FF4FA8', toneMapped: false, fog: false }));
sun.position.set(40, 8, -60); sun.lookAt(cam.position); scene.add(sun);
const towers = new T.InstancedMesh(new T.BoxGeometry(1, 1, 1), new T.MeshBasicMaterial({ color: '#1A0B3A', fog: false }), 60);
for (let i = 0; i < 60; i++) { const h = 3 + ((i * 7919) % 13); tmp.position.set(-40 + i * 2.2, h / 2 - 1, -45 - (i % 3) * 4); tmp.scale.set(1.8, h, 1.8); tmp.updateMatrix(); towers.setMatrixAt(i, tmp.matrix); }
scene.add(towers);

// The runners to compare, all scaled to the same height. Each has our own materials (by its material names), the
// physics-owned jump (a held pose, or a looping airborne clip) and a gesture.
const H = 1.38; // lab height for every runner
const RUNNERS = {
  robot: { label: 'Robot', data: robot, height: 4.6, mirror: true, jump: { hold: [0.21, 0.33] }, gesture: 'wave', note: 'RobotExpressive (CC0)' },
  heroM: { label: 'Hero M', data: heroM, height: 1.82, mirror: false, jump: { loop: 'jump' }, gesture: 'dance', note: 'Universal Base Characters + Animation Library (CC0)' },
  heroF: { label: 'Hero F', data: heroF, height: 1.78, mirror: false, jump: { loop: 'jump' }, gesture: 'dance', note: 'Universal Base Characters + Animation Library (CC0)' },
};
function makeRunner(key) {
  const R = RUNNERS[key];
  const mats = key === 'robot'
    ? { Main: new T.MeshStandardMaterial({ roughness: 0.35, metalness: 0.2 }), Grey: new T.MeshStandardMaterial({ color: '#2A2440', roughness: 0.3, metalness: 0.8 }), Black: new T.MeshStandardMaterial({ color: '#05030A', roughness: 0.5, metalness: 0.4 }) }
    : { suit: outfitMaterial(T), eyes: new T.MeshBasicMaterial({ color: '#FFFFFF', toneMapped: false }), brows: new T.MeshStandardMaterial({ color: '#05030A' }) };
  const pick = (n) => (key === 'robot' ? mats[n] || mats.Grey : /eye/i.test(n) ? mats.eyes : /hair/i.test(n) ? mats.brows : mats.suit);
  const rig = buildRig(T, R.data, pick);
  const sc = H / R.height;
  rig.root.scale.set(R.mirror ? -sc : sc, sc, sc); // the robot is mirrored so its left side (its wave) faces the camera
  rig.root.rotation.y = Math.PI / 2; // face down the track (+x)
  rig.root.traverse((o) => { o.frustumCulled = false; });
  let tris = 0; rig.meshes.forEach((m) => { tris += m.geometry.index.count / 3; });
  if (key !== 'robot') for (const m of rig.meshes) {
    if (m.material === mats.suit) setVisor(mats.suit, tagParts(T, m));
    else m.visible = false; // the helmet covers the eyes and brows
  }
  return { key, R, rig, mats, tris, cur: null };
}
const runners = Object.fromEntries(Object.keys(RUNNERS).map((k) => [k, makeRunner(k)]));
let rn = runners[new URLSearchParams(location.search).get('runner') in RUNNERS ? new URLSearchParams(location.search).get('runner') : 'robot'];
for (const r of Object.values(runners)) { scene.add(r.rig.root); r.rig.root.visible = r === rn; }

let skinNow = null;
function skin(s) {
  skinNow = s;
  for (const r of Object.values(runners)) {
    const M = r.mats;
    if (r.key === 'robot') { M.Main.color.set(s.a); M.Main.emissive.set(s.a); M.Main.emissiveIntensity = 0.55; M.Black.emissive.set(s.b); M.Black.emissiveIntensity = 0.9; }
    else applyOutfit(M.suit, OUTFITS[s.id] || OUTFITS.volt, performance.now() / 1000);
  }
}
skin(SKINS[0]);

const composer = new T.EffectComposer(renderer);
composer.addPass(new T.RenderPass(scene, cam));
const bloom = new T.UnrealBloomPass(new T.Vector2(2, 2), 0.7, 0.5, 0.6);
composer.addPass(bloom);
composer.addPass(new T.OutputPass());

// Animation. The physics owns the jump: the robot holds a pose from inside its jump clip; a hero loops its airborne clip.
const JV = 7.5, G = 26, RISE = JV / G;
let y = 0, vy = 0, dead = false, airborne = false;
let facing = 0, turn = 0; // gestures turn the runner toward the camera
const fade = (name, once, blend = 0.1) => {
  const A = rn.rig.actions, next = A[name];
  if (next === rn.cur) { next.reset().play(); return; }
  next.reset(); next.timeScale = 1; next.setLoop(once ? T.LoopOnce : T.LoopRepeat, Infinity); next.clampWhenFinished = once;
  next.play(); if (rn.cur) rn.cur.crossFadeTo(next, blend, false); rn.cur = next;
};
function startJump() {
  const j = rn.R.jump, a = rn.rig.actions.jump;
  a.reset(); a.timeScale = 1;
  if (j.hold) { a.setLoop(T.LoopOnce, 1); a.clampWhenFinished = true; a.time = j.hold[0]; a.timeScale = (j.hold[1] - j.hold[0]) / RISE; }
  else a.setLoop(T.LoopRepeat, Infinity);
  a.play(); rn.cur.crossFadeTo(a, 0.06, false); rn.cur = a;
}
const jump = () => {
  if (dead) { dead = false; fade('run', false); return; }
  if (airborne) return;
  vy = JV; airborne = true; facing = 0; startJump();
};
function use(key) {
  rn.rig.root.visible = false; rn = runners[key]; rn.rig.root.visible = true;
  rn.rig.mixer.stopAllAction(); rn.cur = null; dead = false; airborne = false; y = 0; vy = 0; facing = 0;
  fade('run', false);
  bar.querySelectorAll('.rk').forEach((x) => x.classList.toggle('on', x.dataset.k === key));
}
const bar = document.getElementById('bar');
const btn = (label, fn, cls = '') => { const b = document.createElement('button'); b.textContent = label; b.className = cls; b.onclick = (e) => { e.stopPropagation(); fn(b); }; bar.append(b); return b; };
for (const k of Object.keys(RUNNERS)) { const b = btn(RUNNERS[k].label, () => use(k), 'rk'); b.dataset.k = k; }
btn('Jump', jump); btn('Crash', () => { dead = true; facing = 0; fade('death', true); }); btn('Gesture', () => { facing = 1; fade(rn.R.gesture, false); });
btn('Run', () => { facing = 0; dead = false; fade('run', false); });
for (const s of SKINS) { const b = btn('', () => { skin(s); bar.querySelectorAll('.sw').forEach((x) => x.classList.remove('on')); b.classList.add('on'); }, 'sw'); b.style.background = `radial-gradient(${s.a},${s.b})`; b.title = s.id; }
bar.querySelector('.sw').classList.add('on');
cv.addEventListener('pointerdown', jump);
use(rn.key);

function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h);
  cam.aspect = w / h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const info = document.getElementById('info');
let last = performance.now(), dist = 0, frames = 0, acc = 0, fps = 0, worst = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  worst = Math.max(worst, dt * 1000); acc += dt; frames++;
  if (acc > 1) { fps = frames / acc; info.textContent = `Runner lab · ${rn.R.label}: ${rn.R.note} · ${rn.tris} tris · ${fps.toFixed(0)} fps · worst ${worst.toFixed(0)} ms`; acc = 0; frames = 0; worst = 0; }
  if (!dead) dist += dt * 11;
  if (airborne) {
    vy -= G * dt; y += vy * dt;
    const j = rn.R.jump, a = rn.rig.actions.jump;
    if (j.hold && a.time >= j.hold[1]) { a.time = j.hold[1]; a.timeScale = 0; } // hold the airborne pose
    if (y <= 0) { y = 0; vy = 0; airborne = false; if (!dead) fade('run', false, 0.08); }
  }
  rn.rig.root.position.y = y;
  turn += (facing - turn) * (1 - Math.exp(-dt * 10));
  rn.rig.root.rotation.y = Math.PI / 2 - turn * 1.15; // about 66 degrees toward the camera
  for (let i = 0; i < 80; i++) { tmp.position.set(-20 + ((i * 1.2 - dist) % 96 + 96) % 96, 0.006, 0); tmp.scale.set(1, 1, 1); tmp.updateMatrix(); lines.setMatrixAt(i, tmp.matrix); }
  lines.instanceMatrix.needsUpdate = true;
  rn.rig.mixer.update(dt);
  if (rn.key !== 'robot' && skinNow) applyOutfit(rn.mats.suit, OUTFITS[skinNow.id] || OUTFITS.volt, now / 1000);
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
