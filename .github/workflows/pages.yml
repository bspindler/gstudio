name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # Off until Pages is enabled, so pushes to main don't fail before then. To turn it on:
  # 1. Settings > Pages > Build and deployment > Source: choose "GitHub Actions".
  # 2. Settings > Secrets and variables > Actions > Variables: add PAGES_ENABLED with the value true.
  # Then push to main, or run this workflow by hand from the Actions tab.
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
